<!doctype html>

<head>

<title>Week 15 · Product Differentiation (Part 1)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Schibsted+Grotesk:wght@400;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<link rel="stylesheet" href="assets/course.css">
<style>
:root{--wk:#4D7C0F;--wk-soft:rgba(77,124,15,.09);--wk-d:#BEF264;--wk-soft-d:rgba(190,242,100,.14)}
.ctab{overflow-x:auto}
.ctab .tbl td{text-align:center}
.ctab .tbl td:first-child,.ctab .tbl th:first-child{text-align:left}
.ctab .us td{background:var(--wk-soft)}
.dots{white-space:nowrap;letter-spacing:1px;color:var(--wk)}
</style>
</head>
<body>
<script src="assets/site.js"></script>
<script src="assets/supports.js"></script>
<script src="assets/course.js"></script>
<script src="assets/onepage.js"></script>
<script src="assets/ent141.js"></script>
<script src="assets/kb.js"></script>
<script src="assets/search-index.js"></script>
<script src="assets/assistant.js"></script>
<script>
const {W} = Lecture; const {store,esc} = ENT141;
const T=(x,y,s,o='')=>`<text x="${x}" y="${y}" text-anchor="middle" font-family="Schibsted Grotesk,Arial" ${o} fill="var(--ink)">${s}</text>`;

const GENERIC=`<svg viewBox="0 0 520 260" role="img" aria-label="Porter's generic strategies: cost leadership, differentiation, and focus" style="width:100%;height:auto">
  ${T(250,18,'Source of advantage','font-size="12.5" font-weight="700"')}
  ${T(185,40,'Lower cost','font-size="12.5"')}${T(375,40,'Uniqueness','font-size="12.5"')}
  <text x="28" y="150" transform="rotate(-90 28 150)" text-anchor="middle" font-family="Schibsted Grotesk,Arial" font-size="12.5" font-weight="700" fill="var(--ink)">Target</text>
  ${T(62,105,'Broad','font-size="12.5"')}${T(62,205,'Narrow','font-size="12.5"')}
  <rect x="95" y="52" width="180" height="96" rx="8" fill="none" stroke="var(--line)" stroke-width="1.5"/>${T(185,98,'Cost leadership','font-size="14" font-weight="700"')}${T(185,118,'e.g. Southwest Airlines','font-size="12"')}
  <rect x="285" y="52" width="180" height="96" rx="8" fill="var(--wk)" fill-opacity=".25" stroke="var(--wk)" stroke-width="2.5"/>${T(375,98,'Differentiation','font-size="14" font-weight="800"')}${T(375,118,'today','font-size="12"')}
  <rect x="95" y="156" width="370" height="90" rx="8" fill="none" stroke="var(--line)" stroke-width="1.5"/>${T(280,200,'Focus: cost or difference for one narrow segment','font-size="13.5" font-weight="700"')}${T(280,220,'(Week 11)','font-size="12"')}
</svg>`;

const PARITY=`<div class="cmp"><div><h4>Points of parity</h4><p style="margin:0 0 6px">What customers expect from <b>any</b> airline:</p><ul><li>Safe flights</li><li>Reaching the destination on schedule</li><li>Easy booking</li></ul></div><div><h4>Points of difference</h4><p style="margin:0 0 6px">What made Southwest stand out for decades:</p><ul><li>Low fares</li><li>Direct point-to-point routes</li><li>Fast turnarounds with one aircraft type (Boeing 737)</li></ul></div></div>`;

const SOURCES={'Five sources · real cases':[
  ['Features','IKEA designs furniture to ship flat and be assembled by the customer, which keeps prices low.'],
  ['Service','Grameen Bank lends small amounts to poor borrowers, mostly women, without collateral, through small groups.'],
  ['Price','Southwest Airlines kept costs low with one aircraft type and direct routes, so it could offer low fares.'],
  ['Sustainability','Patagonia repairs and resells used clothing through its Worn Wear programme, and is a founding member of 1% for the Planet.'],
  ['Experience','Netflix started with DVDs by post with no late fees, then moved to streaming in 2007.']]};

const COMP=[['Our rest point (illustrative)',[5,4,4,3],1],['Petrol station shop',[3,3,1,4],0],['Mall food court',[4,2,2,2],0],['Waiting outside (do nothing)',[1,5,1,5],0]];
const CRIT=['Shade and cooling','Close to restaurants','Phone charging','Cost to the rider (5 = free)'];
const dots=n=>`<span class="dots" aria-label="${n} of 5">${'●'.repeat(n)}${'○'.repeat(5-n)}</span>`;
const COMPTAB=`<div class="ctab"><table class="tbl"><thead><tr><th>Option</th>${CRIT.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${COMP.map(([n,v,u])=>`<tr class="${u?'us':''}"><td>${n}</td>${v.map(x=>`<td>${dots(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;

const FIX=[
  {q:'“We are different because we are better.”',type:'not specific',hint:'Better at what, for whom? Name one criterion from your ranked pains and gains.'},
  {q:'The competitor table only lists apps like ours.',type:'missing substitutes',hint:'Add what customers do today instead, including “do nothing”.'},
  {q:'“Our point of difference: we are friendly.”',type:'point of parity',hint:'Customers expect friendly service everywhere. Find something competitors do not offer.'},
  {q:'Ratings in the table come from the team’s opinion.',type:'no evidence',hint:'Base ratings on interviews, visits, prices or reviews you can show.'}];

function reflect(qs,exit){ return `<div class="stack ui">${qs.map((q,i)=>`<div class="feedback"><b>Q${i+1}</b> ${q}</div>`).join('')}<div class="box exam"><b class="lbl">Exit question</b>${exit}</div></div>`; }

Lecture.mount({
  id:'ent141-w15', week:15, clo:'1, 3', course:'ENT 141', short:'Week 15 · Product Differentiation (Part 1)',
  title:'Product Differentiation (Part 1)', meta:'Byers et al. (2019), Porter (1985) · 2-hour lecture',
  scenes:[
  { nav:'Start here', title:'Why would a customer choose you?', minutes:5,
    narration:[`Customers already solve their problem somehow. Today your team finds what makes its idea different in a way customers value. <span class="mono">Topics: Differentiation · Parity vs Difference · Sources · Competitor Table. CLO 1 · CLO 3.</span>`],
    think:`Two shawarma shops stand next to each other near your home. Why do you choose one? Is it the taste, the price, the speed, or something else?`,
    src:`Reading: Byers, T. H., Dorf, R. C., &amp; Nelson, A. J. (2019). <em>Technology ventures: From idea to enterprise</em> (5th ed.). McGraw-Hill.`,
    fig:{label:`Today's lecture · 120 minutes`, build:el=>W.agenda(el,[[`Start here`,5,'l'],[`What is differentiation?`,10,'l'],[`Parity vs difference`,15,'l'],[`Sources of difference`,15,'l'],[`Competitor table`,15,'l'],[`Mistake → fix`,5,'l'],[`Your competitor table`,45,'a'],[`Think about it`,10,'a']])} },

  { nav:'What is differentiation?', title:'What is differentiation?', minutes:10,
    narration:[`<b>Differentiation</b> means offering something unique that customers value and will choose you for. Porter names it one of three generic strategies, next to cost leadership and focus.`],
    src:`Porter, M. E. (1985). <em>Competitive advantage</em>. Free Press. · Byers et al. (2019).`,
    fig:{label:`Porter's generic strategies`, html:GENERIC} },

  { nav:'Parity vs difference', title:'Points of parity vs points of difference', minutes:15,
    narration:[`<b>Points of parity</b> are what customers expect from every option; you must match them. <b>Points of difference</b> are what makes you the better choice. Example: Southwest Airlines.`],
    src:`Keller, K. L., Sternthal, B., &amp; Tybout, A. M. (2002). Three questions you need to ask about your brand. <em>Harvard Business Review</em>, 80(9). · Porter, M. E. (1996). What is strategy? <em>Harvard Business Review</em>, 74(6).`,
    fig:{label:`Real case · Southwest Airlines`, html:PARITY} },

  { nav:'Sources of difference', title:'Five sources of differentiation', minutes:15,
    narration:[`You can differ through <b>features</b>, <b>service</b>, <b>price</b>, <b>sustainability</b> or <b>experience</b>. A strong venture picks one or two and does them very well.`],
    src:`Inter IKEA Systems B.V. (n.d.). <em>The IKEA concept</em>. · Yunus, M. (1999). <em>Banker to the poor</em>. PublicAffairs. · Patagonia (n.d.). <em>Worn Wear</em>. · Netflix (n.d.). <em>About Netflix</em>.`,
    fig:{label:`Real cases · click a source`, build:el=>W.picker(el,SOURCES,'Select a source.')} },

  { nav:'Competitor table', title:'The competitor table', minutes:15,
    narration:[`A <b>competitor table</b> rates your idea and the alternatives on the criteria customers ranked in Week 13. Include substitutes and “do nothing”. Where you score highest is a possible point of difference.`],
    src:`Byers et al. (2019). · Osterwalder et al. (2014).`,
    fig:{label:`Illustrative competitor table · rider example`, html:COMPTAB, caption:`Illustrative ratings only. Your team rates with evidence from interviews, visits and prices.`} },

  { nav:'Mistake → fix', title:'Mistake → fix', kind:'review', minutes:5,
    narration:[`These mistakes make a difference claim weak. Say the fix before you reveal it.`],
    fig:{label:`Common mistakes · reveal the fix`, build:el=>W.practice(el,FIX,{label:'Fix',prefix:''})} },

  { nav:'Your competitor table', title:'Activity · Your team’s competitor table', kind:'activity', minutes:45, wide:true,
    narration:[`Use your ranked pains and gains as criteria. Rate each option 1 to 5 with a reason. This starts section 5 of the <a href="project-2.html">Project 2 builder</a>.`],
    fig:{label:`Competitor table · saves in your browser`, build:el=>W.worksheet(el,{id:'ent141-w15-competitors',title:'ENT 141 · Project 2 · Section 5a · Competitor table',fields:[
      {l:'Competitors: 2–3 direct, 1 substitute, and “do nothing”',rows:3},
      {l:'Criteria: 3–4 from your ranked pains and gains',rows:2},
      {l:'Ratings 1–5 for each option, with the evidence behind them',rows:4},
      {l:'Points of parity we must match',rows:2},
      {l:'Our points of difference, and their source (features, service, price, sustainability, experience)',rows:3}]})} },

  { nav:'Think about it', title:'Think about it', kind:'review', minutes:10,
    narration:[`Discuss with your team. There is no single right answer.`,`<b>Next week:</b> Product Differentiation, part 2: positioning map and the final Project 2 check. Bring your competitor table.<br><a class="btn" href="week-16.html">Next lecture · Week 16 · Product Differentiation (Part 2) →</a>`],
    fig:{label:`Reflection`, html:reflect([`Could a big company copy your point of difference in a month? What then?`,`Is “cheaper” a good point of difference for a social venture?`,`Why does “do nothing” often win?`],`Name your team’s strongest point of difference and the evidence for it.`)} },
  ]
});
</script>
</body>
</html>
