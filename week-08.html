<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Week 8 · Idea Evaluation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Schibsted+Grotesk:wght@400;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<link rel="stylesheet" href="assets/course.css">
<style>
:root{--wk:#6D28D9;--wk-soft:rgba(109,40,217,.09);--wk-d:#C4B5FD;--wk-soft-d:rgba(196,181,253,.14)}
.svgfig{width:100%;height:auto;display:block}
/* case card */
.cc{border:1px solid var(--line);border-radius:12px;overflow:hidden;font-family:var(--f-display);background:var(--bg)}
.cc-hd{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--wk-soft);border-bottom:1px solid var(--line)}
.cc-ic{flex:none;width:44px;height:44px;border-radius:50%;background:var(--wk);color:var(--on-wk);display:grid;place-items:center;font-weight:800;font-size:1.1rem}
.cc-hd b{display:block;font-size:1.05rem;color:var(--ink)}
.cc-hd small{display:block;font-family:var(--f-mono);font-size:.72rem;color:var(--muted);letter-spacing:.04em}
.cc-lens{margin-left:auto;font-family:var(--f-mono);font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--wk);color:var(--wk);border-radius:999px;padding:2px 9px;white-space:nowrap}
.cc dl{margin:0;padding:4px 14px 10px}
.cc dl > div{display:grid;grid-template-columns:120px minmax(0,1fr);gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}
.cc dl > div:last-child{border-bottom:0}
.cc dt{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-top:2px}
.cc dd{margin:0;font-size:.93rem;line-height:1.4;color:var(--ink)}
.cc dl > div.ls dt{color:var(--wk);font-weight:600}
.cc dl > div.ls dd{font-weight:700}
@media (max-width:520px){.cc dl > div{grid-template-columns:minmax(0,1fr);gap:2px}.cc-lens{display:none}}
/* in-depth case text */
.case-read{border-left:4px solid var(--wk);background:var(--wk-soft);border-radius:0 10px 10px 0;padding:10px 14px;font-size:.97rem;line-height:1.55}
.case-read b.lbl{display:block;font-family:var(--f-mono);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--wk);margin-bottom:4px}
.case-read p{margin:.35em 0}
/* scoring matrix */
.mx-wrap{overflow-x:auto;max-width:100%}
.mx{width:100%;border-collapse:collapse;font-family:var(--f-display);font-size:.88rem;min-width:420px}
.mx th,.mx td{border-bottom:1px solid var(--line);padding:6px 6px;text-align:center;vertical-align:middle}
.mx th:first-child,.mx td:first-child{text-align:left}
.mx thead th{font-weight:700;color:var(--ink)}
.mx td small{display:block;font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.mx tr.tot td{font-weight:800;border-top:2px solid var(--ink);border-bottom:0}
.mx td.win{background:var(--wk-soft);color:var(--wk)}
.mx input[type=text]{width:100%;min-width:70px;font:inherit;font-weight:700;border:1px solid var(--line);border-radius:6px;padding:4px 6px;background:var(--bg);color:var(--ink);text-align:center}
.mx input[type=number]{width:58px;font:inherit;border:1px solid var(--line);border-radius:6px;padding:4px;background:var(--bg);color:var(--ink)}
.mx select{font:inherit;border:1px solid var(--line);border-radius:6px;padding:3px;background:var(--bg);color:var(--ink)}
.mx .hide{visibility:hidden}
.mx td:nth-child(2){white-space:nowrap}
.mx-ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 10px}
.mx-gap{height:14px}
@media (max-width:480px){.mx{min-width:0;font-size:.76rem}.mx th,.mx td{padding:5px 3px}.mx input[type=number]{width:44px}.mx input[type=text]{min-width:0}}
.tm{border-collapse:collapse;width:100%;min-width:480px}.tm th,.tm td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:center;vertical-align:middle}.tm th:first-child,.tm td:first-child{text-align:left;width:34%}.tm tr.tot td{font-weight:800;border-top:2px solid var(--ink);border-bottom:0}.tm td.win{background:var(--wk-soft);color:var(--wk);border-radius:8px}</style>
</head>
<body>
<script src="assets/site.js"></script>
<script src="assets/supports.js"></script>
<script src="assets/course.js"></script>
<script src="assets/onepage.js"></script>
<script src="assets/ent141.js"></script>
<script src="assets/kb.js"></script>
<script src="assets/search-index.js"></script>
<script src="assets/assistant.js"></script>
<script>
const {W} = Lecture; const {store,esc} = ENT141;
const FF='font-family="Schibsted Grotesk,Arial"';


/* ---------- case card ---------- */
function caseCard(c){
  return `<article class="cc" aria-label="Case study: ${c.org}">
    <div class="cc-hd"><span class="cc-ic" aria-hidden="true">${c.ic}</span><div><b>${c.org}</b><small>${c.where} · ${c.year}</small></div><span class="cc-lens">${c.lens}</span></div>
    <dl><div><dt>What they did</dt><dd>${c.did}</dd></div>
      <div><dt>${c.bad?'What went wrong':'Why it worked'}</dt><dd>${c.why}</dd></div>
      <div class="ls"><dt>Lesson</dt><dd>${c.lesson}</dd></div></dl></article>`;
}
const CASES={
  embrace:{ic:'E',org:'Embrace infant warmer',where:'Stanford d.school, USA · India',year:'2007',lens:'Risky',
    did:'Students planned a cheap incubator for hospitals. In Nepal they saw many babies are born far from hospitals.',
    why:'They took a bold risk. They dropped the hospital idea. They made a warm sleeping bag that needs no constant power.',
    lesson:'A risky idea can win. Test it early with real users.'},
  ideo:{ic:'I',org:'IDEO shopping cart',where:'Palo Alto, USA',year:'1999',lens:'Easy',
    did:'For a TV show, the IDEO team designed a new shopping cart in five days.',
    why:'They watched shoppers, then built rough models fast. Quick tries showed what worked.',
    lesson:'Easy ideas are quick to try. Try them first to learn fast.'},
  ikea:{ic:'K',org:'IKEA flat-pack',where:'Sweden',year:'1956',lens:'Aligned',
    did:'A worker took the legs off a table to fit it in a car. IKEA began selling furniture in flat boxes.',
    why:'The idea matched the exact pain: big furniture does not fit in a car.',
    lesson:'A good idea answers the real problem, not a different one.'},
  terra:{ic:'T',org:'Terra · Sustainability Pavilion',where:'Expo 2020 Dubai, UAE',year:'2021',lens:'Favourite',
    did:'The pavilion was designed to make its own energy from the sun and to save water.',
    why:'Sustainability was the heart of the plan from day one, not added at the end.',
    lesson:'A favourite idea gives a team energy. Still check it fits the problem.'}};

/* ---------- concept graphic: three groups ---------- */
const GROUPS=`<svg class="svgfig" viewBox="0 0 600 250" role="img" aria-label="Three boxes: Risky, Easy and Favourite, each with a short question">
  ${[['Risky','Bold, but uncertain','Could it change everything?'],['Easy','Quick and cheap to try','Can we test it this week?'],['Favourite','The team’s heart choice','Which one do we love?']].map(([t,s,q],i)=>{const x=12+i*196;
  return `<rect x="${x}" y="12" width="180" height="226" rx="14" fill="var(--wk)" fill-opacity="${.08+i*.07}" stroke="var(--wk)" stroke-width="2"/>
  <circle cx="${x+90}" cy="70" r="30" fill="var(--wk)"/>
  <text x="${x+90}" y="78" text-anchor="middle" ${FF} font-weight="800" font-size="22" style="fill:var(--on-wk)">${t[0]}</text>
  <text x="${x+90}" y="135" text-anchor="middle" ${FF} font-weight="800" font-size="19" style="fill:var(--ink)">${t}</text>
  <text x="${x+90}" y="162" text-anchor="middle" ${FF} font-size="13" style="fill:var(--muted)">${s}</text>
  <text x="${x+90}" y="205" text-anchor="middle" ${FF} font-size="13" font-style="italic" style="fill:var(--ink)">${q}</text>`;}).join('')}
</svg>`;

/* ---------- concept graphic: idea and problem fit ---------- */
const ALIGN=`<svg class="svgfig" viewBox="0 0 600 260" role="img" aria-label="The HMW problem on the left, the idea on the right, joined by three checks: who, pain, evidence">
  <rect x="10" y="40" width="170" height="180" rx="14" fill="var(--wk-soft)" stroke="var(--wk)" stroke-width="2"/>
  <text x="95" y="120" text-anchor="middle" ${FF} font-weight="800" font-size="18" style="fill:var(--ink)">Problem</text>
  <text x="95" y="144" text-anchor="middle" ${FF} font-size="13" style="fill:var(--muted)">our HMW question</text>
  <rect x="420" y="40" width="170" height="180" rx="14" fill="var(--wk-soft)" stroke="var(--wk)" stroke-width="2"/>
  <text x="505" y="120" text-anchor="middle" ${FF} font-weight="800" font-size="18" style="fill:var(--ink)">Idea</text>
  <text x="505" y="144" text-anchor="middle" ${FF} font-size="13" style="fill:var(--muted)">our chosen solution</text>
  ${[['Who?','same user',70],['Pain?','same pain',130],['Evidence?','interview proof',190]].map(([t,s,y])=>`<line x1="180" y1="${y}" x2="420" y2="${y}" stroke="var(--line)" stroke-width="2"/>
  <rect x="222" y="${y-21}" width="156" height="42" rx="21" fill="var(--bg)" stroke="var(--wk)" stroke-width="2"/>
  <text x="300" y="${y-2}" text-anchor="middle" ${FF} font-weight="800" font-size="14" style="fill:var(--wk)">${t}</text>
  <text x="300" y="${y+14}" text-anchor="middle" ${FF} font-size="11.5" style="fill:var(--muted)">${s}</text>`).join('')}
</svg>`;

/* ---------- sort widget (fictional ideas, Week 6 HMW) ---------- */
const SORT={buckets:['Risky','Easy','Favourite'],items:[
  {t:'A new metro line to campus',a:0,why:'Bold and very uncertain. Students cannot build it.'},
  {t:'A WhatsApp carpool group',a:1,why:'Free and quick. The team can test it this week.'},
  {t:'A shared scooter path from the metro',a:0,why:'Big impact, but it needs permits and money.'},
  {t:'A printed bus timetable at the gate',a:1,why:'Cheap and fast to try.'},
  {t:'A campus shuttle that also sells breakfast',a:2,why:'Many teams love it. It joins two needs in one.'},
  {t:'Walking buddies from the metro',a:2,why:'Friendly and social. Teams often like it most.'}]};

/* ---------- fit check flow ---------- */
const FIT=[
  {t:'Read the HMW',s:'from Week 6',d:'“How might we help first-year students reach 8 am classes on time without a car?”'},
  {t:'Who?',s:'same user',d:'Idea: a WhatsApp carpool group. User: first-year students without a car. Match.'},
  {t:'Pain?',s:'same pain',d:'Pain: arriving late at 8 am. Carpools leave at a fixed time. Match.'},
  {t:'Evidence?',s:'interviews',d:'Find a quote. Example: “I wait 20 minutes for the bus.” No quote means no proof.'},
  {t:'Decide',s:'fit or not',d:'Three matches: keep the idea. One miss: change the idea or go back.'}];

/* ---------- worked scoring example (fictional), from the Week 6 HMW ---------- */
const EXAMPLE={ideas:['Metro shuttle','Carpool board','Scooter path'],
  crit:[['Desirable',30],['Feasible',25],['Viable',20],['Sustainable',25]],
  s:[[5,4,3],[3,5,3],[3,4,3],[4,4,5]]};
const STEPTXT=[
  'Press <b>Next step</b> to build the table.',
  '<b>Step 1 · Weights.</b> Four criteria. The weights add up to 100%.',
  '<b>Step 2 · Score.</b> Give each idea 1 (weak) to 5 (strong). Use interview facts.',
  '<b>Step 3 · Multiply.</b> Weight × score. Carpool board, desirable: 30% × 4 = <b>1.20</b>.',
  '<b>Step 4 · Add.</b> Carpool board: 1.20 + 1.25 + 0.80 + 1.00 = <b>4.25</b>. The highest.',
  '<b>Step 5 · Talk.</b> If two totals are close, discuss before you decide.'];
const f2=x=>(Math.round(x*100)/100).toFixed(2);
function totals(st){ return st.ideas.map((_,j)=>st.crit.reduce((a,[,w],i)=>a+w/100*(+st.s[i][j]||0),0)); }

function matrix(el,{init}){
  const st=JSON.parse(JSON.stringify(init)); let step=0;
  const draw=()=>{
    const tot=totals(st), best=Math.max(...tot), wsum=st.crit.reduce((a,c)=>a+(+c[1]||0),0);
    const hd=st.ideas.map(t=>`<th>${esc(t)}</th>`).join('');
    const rows=st.crit.map(([c,w],i)=>`<tr><td>${esc(c)}</td><td class="${step<1?'hide':''}">${w}%</td>${st.ideas.map((_,j)=>{ const sc=st.s[i][j];
        return `<td class="${step<2?'hide':''}">${sc}<small class="${step<3?'hide':''}">${f2(w/100*sc)}</small></td>`; }).join('')}</tr>`).join('');
    const totRow=`<tr class="tot"><td>Total</td><td class="${step<1?'hide':''}">${wsum}%</td>${tot.map(t=>`<td class="${step<4?'hide':''} ${step>=4&&t===best?'win':''}">${f2(t)}</td>`).join('')}</tr>`;
    el.innerHTML=`<div class="mx-ctl"><button type="button" class="btn mx-next">${step<5?'Next step':'Start again'}</button><span class="mono" style="color:var(--muted)">Step ${step} of 5</span></div>
      <div class="mx-wrap"><table class="mx"><thead><tr><th>Criterion</th><th>Weight</th>${hd}</tr></thead><tbody>${rows}${totRow}</tbody></table></div>
      <div class="mx-gap"></div><div class="feedback">${STEPTXT[step]}</div>`;
    el.querySelector('.mx-next').addEventListener('click',()=>{ step=step<5?step+1:0; draw(); });
  };
  draw();
}

/* ---------- case study in depth: Grameen Bank ---------- */
const DEEP=`<div class="case-read"><b class="lbl">Case study · Grameen Bank · Bangladesh · 1976–2006</b>
<p>In 1976, economics professor Muhammad Yunus visited Jobra, a village in Bangladesh. Poor women made bamboo stools. They borrowed from lenders who charged very high interest.</p>
<p>Banks would not lend to them. They had no collateral (something the bank can keep).</p>
<p>Yunus lent his own money, about US$27, to 42 villagers. They paid him back.</p>
<p>He then built a new kind of bank. Grameen means “of the village”. Borrowers joined small groups and paid back in small weekly amounts. In 1983, Grameen became a formal bank by law.</p>
<p>In 2006, Yunus and Grameen Bank shared the Nobel Peace Prize.</p></div>`;

const FIX=[
  {q:'Every idea goes into the Favourite group.',type:'no sorting',hint:'Each group needs ideas. Ask: which one is bold? Which one is quick?'},
  {q:'The team picks only Easy ideas.',type:'playing safe',hint:'Keep one Risky idea in view. It may solve the problem better.'},
  {q:'The chosen idea helps a different user.',type:'no fit',hint:'Go back to the HMW. Same user, same pain.'},
  {q:'“Students will love it.” No quote.',type:'no evidence',hint:'Add one interview quote that shows the pain.'}];

function teamMatrix(el){
  const K='ent141-w08-team', CR=[['Desirable · people want it',30],['Feasible · we can build it',25],['Viable · it can pay for itself',25],['Sustainable · good for people and planet',20]];
  let st; try{ st=JSON.parse(localStorage.getItem(K)||'null'); }catch(e){}
  if(!st) st={ideas:['Idea 1','Idea 2','Idea 3'],w:CR.map(c=>c[1]),s:CR.map(()=>['','',''])};
  const save=()=>{ try{ localStorage.setItem(K,JSON.stringify(st)); }catch(e){} };
  const inp='font:inherit;width:100%;box-sizing:border-box;padding:6px 6px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);text-align:center';
  el.innerHTML=`<div class="mx-wrap"><table class="tm"><thead><tr><th style="text-align:left">Criterion</th><th>Weight %</th>${st.ideas.map((t,j)=>`<th><input data-i="${j}" value="${esc(t)}" aria-label="Idea ${j+1} name" style="${inp};font-weight:700"></th>`).join('')}</tr></thead>
   <tbody>${CR.map(([c],i)=>`<tr><td style="text-align:left">${esc(c)}</td><td><input type="number" min="0" max="100" data-w="${i}" value="${st.w[i]}" aria-label="${esc(c)} weight" style="${inp};width:70px"></td>${[0,1,2].map(j=>`<td><input type="number" min="1" max="5" data-s="${i}-${j}" value="${st.s[i][j]}" placeholder="1–5" aria-label="${esc(c)} score" style="${inp};width:70px"></td>`).join('')}</tr>`).join('')}
   <tr class="tot"><td style="text-align:left">Weighted total</td><td data-ws></td>${[0,1,2].map(j=>`<td data-t="${j}"></td>`).join('')}</tr></tbody></table></div>
   <p class="feedback" data-msg style="margin-top:8px"></p>`;
  const calc=()=>{ const ws=st.w.reduce((a,b)=>a+(+b||0),0); el.querySelector('[data-ws]').textContent=ws+'%';
    const tot=[0,1,2].map(j=>CR.reduce((a,_,i)=>a+(+st.w[i]||0)/100*(+st.s[i][j]||0),0)); const best=Math.max(...tot);
    tot.forEach((t,j)=>{ const c=el.querySelector(`[data-t="${j}"]`); c.textContent=t?f2(t):'—'; c.className=t&&t===best?'win':''; });
    const sorted=[...tot].sort((a,b)=>b-a); const m=el.querySelector('[data-msg]');
    m.innerHTML=ws!==100?`Weights add up to <b>${ws}%</b>. Make them 100%.`:!best?'Score each idea from 1 (weak) to 5 (strong).':(sorted[0]-sorted[1]<0.3?`Close call: talk as a team before you choose.`:`Highest: <b>${esc(st.ideas[tot.indexOf(best)])}</b>. Check it still fits your problem.`); };
  el.addEventListener('input',e=>{ const t=e.target; if(t.dataset.i!=null) st.ideas[+t.dataset.i]=t.value; if(t.dataset.w!=null) st.w[+t.dataset.w]=t.value;
    if(t.dataset.s){ const [i,j]=t.dataset.s.split('-').map(Number); let v=t.value; if(v!==''){ v=Math.max(1,Math.min(5,Math.round(+v)||1)); } st.s[i][j]=v; }
    save(); calc(); });
  calc();
}
function sortActivity(el){
  const t=document.createElement('div'); t.innerHTML='<p class="mono" style="margin:0 0 6px;color:var(--muted)">1 · Score your top three ideas</p>'; el.appendChild(t);
  const m=document.createElement('div'); el.appendChild(m); teamMatrix(m);
  const h=document.createElement('p'); h.className='mono'; h.style.cssText='margin:16px 0 6px;color:var(--muted)'; h.textContent='2 · Sort, choose, check'; el.appendChild(h);
  const w=document.createElement('div'); el.appendChild(w); el=w;
  W.worksheet(el,{id:'ent141-w08-select',title:'ENT 141 · Week 8 · Idea evaluation and selection',fields:[
    {l:'Risky ideas (bold, uncertain)',rows:2},
    {l:'Easy ideas (quick to try)',rows:2},
    {l:'Favourite ideas (our heart choice)',rows:2},
    {l:'Chosen idea and why (one sentence)',rows:2},
    {l:'Fit check: who, pain, evidence (one line each)',rows:3}]});
}

Lecture.mount({
  id:'ent141-w08', week:8, clo:'3, 4', course:'ENT 141', short:'Week 8 · Idea Evaluation', instructor:'Nadia',
  title:'Idea Evaluation', meta:'Traifeh et al. (2021) · 2-hour lecture',
  scenes:[
  { nav:'Start here', title:'Many ideas. Which one do we build?', minutes:5,
    narration:[`Last week you made many ideas. Today you sort them and pick one. Then you check it fits the problem. <span class="mono">Topics: Risky, Easy, Favourite · Idea and problem fit. CLO 3 · CLO 4.</span>`],
    think:`You are choosing a phone. One is cheapest. One has the best camera. One is your favourite colour. How do you choose?`,
    src:`Reading: Traifeh, H., Refaei, R. A., von Thienen, J., von Schmieden, K., Mayer, L., Osman, S., &amp; Meinel, C. (2021). Mapping design thinking in the Arab world. In C. Meinel &amp; L. Leifer (Eds.), <em>Design thinking research</em> (pp. 41–60). Springer.`,
    fig:{label:`Today's lecture · 120 minutes`, build:el=>W.agenda(el,[[`Start here`,5,'l'],[`Three groups`,8,'l'],[`Sort the ideas`,10,'l'],[`Risky`,6,'l'],[`Easy`,6,'l'],[`Favourite`,6,'l'],[`Idea ↔ problem`,8,'l'],[`Fit check`,8,'l'],[`Aligned case`,5,'l'],[`Score your top idea`,8,'l'],[`Case study in depth`,15,'a'],[`Mistake → fix`,5,'l'],[`Sort and choose`,25,'a'],[`Think about it`,5,'a']])} },

  { nav:'Three groups', title:'Assessing ideas: Risky, Easy, Favourite', minutes:8,
    narration:[`Sort every idea into one group. <b>Risky</b>: bold, but uncertain. <b>Easy</b>: quick and cheap to try. <b>Favourite</b>: the team’s heart choice.`],
    fig:{label:`Concept · three groups`, html:GROUPS} },

  { nav:'Sort the ideas', title:'Try it: sort six ideas', minutes:10,
    narration:[`Fictional ideas for our Week 6 problem: students late for 8 am classes. Sort each idea. Then compare with the suggested answer.`],
    fig:{label:`Sort · fictional example`, build:el=>W.sort(el,SORT)} },

  { nav:'Risky', title:'Risky: bold, but uncertain', minutes:6,
    narration:[`A <b>risky</b> idea may change everything. It may also fail. Test it early with real users.`],
    src:`Hasso Plattner Institute of Design at Stanford. Design for Extreme Affordability: Embrace (2007). · Embrace Innovations, company history.`,
    fig:{label:`Case card · real case`, html:caseCard(CASES.embrace)} },

  { nav:'Easy', title:'Easy: quick to try', minutes:6,
    narration:[`An <b>easy</b> idea is fast and cheap to test. It teaches you quickly. It may be less bold.`],
    src:`Kelley, T. (2001). <em>The art of innovation</em>. Currency/Doubleday. · ABC News <em>Nightline</em> (1999, July 13). The deep dive.`,
    fig:{label:`Case card · real case`, html:caseCard(CASES.ideo)} },

  { nav:'Favourite', title:'Favourite: the team’s heart choice', minutes:6,
    narration:[`A <b>favourite</b> idea is the one your team loves. Love gives energy. But love is not proof.`],
    src:`Grimshaw Architects. (2021). <em>Terra – The Sustainability Pavilion, Expo 2020 Dubai</em>.`,
    fig:{label:`Case card · real case`, html:caseCard(CASES.terra)} },

  { nav:'Idea ↔ problem', title:'How to align the idea to the problem?', minutes:8,
    narration:[`Your idea must solve your HMW problem from Week 6. Check three things. Same <b>user</b>. Same <b>pain</b>. <b>Evidence</b> from your interviews.`],
    fig:{label:`Concept · three checks join problem and idea`, html:ALIGN} },

  { nav:'Fit check', title:'Fit check, step by step', minutes:8,
    narration:[`Running example: the WhatsApp carpool group. Press play. Check each step against the HMW.`],
    fig:{label:`Fit check · fictional example`, flow:FIT} },

  { nav:'Aligned case', title:'A real idea that fits its problem', minutes:5,
    narration:[`IKEA saw one clear pain. Big furniture did not fit in a car. The flat box solved that pain.`],
    src:`IKEA. (n.d.). <em>The IKEA story</em>: 1956, flat packs (Gillis Lundgren and the Lövet table).`,
    fig:{label:`Case card · real case`, html:caseCard(CASES.ikea)} },

  { nav:'Score your top idea', title:'Optional · Then score your top idea', minutes:8,
