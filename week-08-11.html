/* ---------- Week 8: worked scoring example (fictional) ---------- */
const EX811={ideas:['Metro shuttle','Carpool board','Scooter path'],
  crit:[['Desirable',30],['Feasible',25],['Viable',20],['Sustainable',25]],
  s:[[5,4,3],[3,5,3],[3,4,3],[4,4,5]]};
const STEP811=[
  'Press <b>Next step</b> to build the table.',
  '<b>Step 1 · Weights.</b> Four criteria. The weights add up to 100%. Here, desirable matters most: 30%.',
  '<b>Step 2 · Score.</b> Give each idea 1 (weak) to 5 (strong). Use interview facts, not feelings.',
  '<b>Step 3 · Multiply.</b> Weight × score. Carpool board, desirable: 30% × 4 = <b>1.20</b>.',
  '<b>Step 4 · Add.</b> Add each column. Carpool board: 1.20 + 1.25 + 0.80 + 1.00 = <b>4.25</b>. The highest.',
  '<b>Step 5 · Talk.</b> 4.25 against 3.85 is a clear winner. If two totals are close, discuss first.'];
const f2_811=x=>(Math.round(x*100)/100).toFixed(2);
function matrix811(el,init){
  const st=JSON.parse(JSON.stringify(init)); let step=0;
  const draw=()=>{
    const tot=st.ideas.map((_,j)=>st.crit.reduce((a,[,w],i)=>a+w/100*st.s[i][j],0)), best=Math.max(...tot);
    const rows=st.crit.map(([c,w],i)=>`<tr><td>${esc(c)}</td><td class="${step<1?'hide':''}">${w}%</td>${st.ideas.map((_,j)=>`<td class="${step<2?'hide':''}">${st.s[i][j]}<small class="${step<3?'hide':''}">${f2_811(w/100*st.s[i][j])}</small></td>`).join('')}</tr>`).join('');
    el.innerHTML=`<div class="mx-ctl"><button type="button" class="btn mx-next">${step<5?'Next step':'Start again'}</button><span class="mono" style="color:var(--muted)">Step ${step} of 5</span></div>
      <div class="mx-wrap"><table class="mx"><thead><tr><th>Criterion</th><th>Weight</th>${st.ideas.map(t=>`<th>${esc(t)}</th>`).join('')}</tr></thead><tbody>${rows}
      <tr class="tot"><td>Total</td><td class="${step<1?'hide':''}">100%</td>${tot.map(t=>`<td class="${step<4?'hide':''} ${step>=4&&t===best?'win':''}">${f2_811(t)}</td>`).join('')}</tr></tbody></table></div>
      <div class="mx-gap"></div><div class="feedback">${STEP811[step]}</div>`;
    el.querySelector('.mx-next').addEventListener('click',()=>{ step=step<5?step+1:0; draw(); });
  };
  draw();
}
