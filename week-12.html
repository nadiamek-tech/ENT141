<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Week 12 · Market/Industry Analysis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Schibsted+Grotesk:wght@400;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<link rel="stylesheet" href="assets/course.css">
<style>
:root{--wk:#9D174D;--wk-soft:rgba(157,23,77,.09);--wk-d:#F9A8D4;--wk-soft-d:rgba(249,168,212,.14)}
.calc{display:grid;gap:8px;font-family:var(--f-display)}
.calc label{font-weight:600;font-size:.88rem}
.calc input{width:100%;min-width:0;border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:var(--surface);color:var(--ink);font:inherit;font-size:.92rem}
.calc .g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:560px){.calc .g2{grid-template-columns:minmax(0,1fr)}}
.calc svg{width:100%;height:auto;max-width:420px;display:block;margin:0 auto}
</style>

<body>
<script src="assets/site.js"></script>
<script src="assets/supports.js"></script>
<script src="assets/course.js"></script>
<script src="assets/onepage.js"></script>
<script src="assets/ent141.js"></script>
<script src="assets/kb.js"></script>
<script src="assets/search-index.js"></script>
<script src="assets/assistant.js"></script>
<script>
const {W} = Lecture; const {store,esc} = ENT141;

const MKT_IND=`<svg viewBox="0 0 520 230" role="img" aria-label="Market is the buyers; industry is the sellers" style="width:100%;height:auto">
  <text x="110" y="22" text-anchor="middle" font-family="Schibsted Grotesk,Arial" font-weight="700" font-size="15" fill="var(--wk)">MARKET · the buyers</text>
  ${[0,1,2,3,4,5].map(i=>{const x=50+(i%3)*60,y=60+Math.floor(i/3)*70;return `<circle cx="${x}" cy="${y}" r="13" fill="var(--wk)" opacity=".85"/><path d="M${x-20} ${y+38} q20 -30 40 0" fill="var(--wk)" opacity=".85"/>`}).join('')}
  <text x="110" y="210" text-anchor="middle" font-family="Schibsted Grotesk,Arial" font-size="13" fill="var(--muted)">people with the need</text>
  <path d="M215 95 H305" stroke="var(--ink)" stroke-width="2" marker-end="url(#ar)"/><text x="260" y="85" text-anchor="middle" font-family="Schibsted Grotesk,Arial" font-size="12" fill="var(--muted)">money</text>
  <path d="M305 145 H215" stroke="var(--ink)" stroke-width="2" marker-end="url(#ar)"/><text x="260" y="168" text-anchor="middle" font-family="Schibsted Grotesk,Arial" font-size="12" fill="var(--muted)">product</text>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--ink)"/></marker></defs>
  <text x="410" y="22" text-anchor="middle" font-family="Schibsted Grotesk,Arial" font-weight="700" font-size="15" fill="var(--ink)">INDUSTRY · the sellers</text>
  ${[0,1,2].map(i=>`<rect x="335" y="${42+i*52}" width="150" height="38" rx="8" fill="none" stroke="var(--ink)" stroke-width="1.5"/><text x="410" y="${66+i*52}" text-anchor="middle" font-family="Schibsted Grotesk,Arial" font-size="13" fill="var(--ink)">Firm ${'ABC'[i]}</text>`).join('')}
  <text x="410" y="210" text-anchor="middle" font-family="Schibsted Grotesk,Arial" font-size="13" fill="var(--muted)">firms selling similar products</text>
</svg>`;

const FUNNEL=`<svg viewBox="0 0 520 240" role="img" aria-label="TAM, SAM and SOM as a narrowing funnel" style="width:100%;height:auto">
  ${[['TAM','Total addressable market','Everyone who has the need',0,500],['SAM','Serviceable available market','The part you can reach',80,340],['SOM','Serviceable obtainable market','The part you can win soon',160,180]].map(([k,t,d,y,w],i)=>`<rect x="${(520-w)/2}" y="${y+6}" width="${w}" height="68" rx="10" fill="var(--wk)" fill-opacity="${.18+i*.3}" stroke="var(--wk)"/>
  <text x="260" y="${y+34}" text-anchor="middle" font-family="Schibsted Grotesk,Arial" font-weight="800" font-size="19" fill="var(--ink)">${k}</text>
  <text x="260" y="${y+56}" text-anchor="middle" font-family="Schibsted Grotesk,Arial" font-size="12.5" fill="var(--ink)">${i<2?t+' · ':''}${d}</text>`).join('')}
</svg>`;

function sizeCalc(el){
  const key='ent141-w12-size'; let st; try{st=JSON.parse(store.get(key)||'null')}catch(e){}
  if(!st) st={n:100000,p:240,sam:40,som:2};
  const f=v=>Math.round(v).toLocaleString('en-US');
  el.innerHTML=`<div class="calc">
    <div class="g2"><div><label for="c-n">Step 1 · Customers with the need (TAM count)</label><input id="c-n" type="number" min="0" data-k="n" value="${st.n}"></div>
    <div><label for="c-p">Step 2 · What one customer pays per year (AED)</label><input id="c-p" type="number" min="0" data-k="p" value="${st.p}"></div>
    <div><label for="c-s">Step 3 · % you can reach (SAM)</label><input id="c-s" type="number" min="0" max="100" data-k="sam" value="${st.sam}"></div>
    <div><label for="c-o">Step 4 · % of SAM you can win in year 1 (SOM)</label><input id="c-o" type="number" min="0" max="100" data-k="som" value="${st.som}"></div></div>
    <div id="c-svg"></div><div class="feedback" id="c-out"></div></div>`;
  const draw=()=>{ const tam=st.n*st.p, samN=st.n*st.sam/100, sam=samN*st.p, somN=samN*st.som/100, som=somN*st.p;
    const r=v=>tam>0?Math.max(16,110*Math.sqrt(v/tam)):16;
    const R=[110,r(sam),r(som)];
    el.querySelector('#c-svg').innerHTML=`<svg viewBox="0 0 420 240" role="img" aria-label="Nested circles: TAM, SAM, SOM">
      ${R.map((x,i)=>`<circle cx="130" cy="${230-x}" r="${x}" fill="var(--wk)" fill-opacity="${.15+i*.28}" stroke="var(--wk)"/>`).join('')}
      ${[['TAM',tam,30],['SAM',sam,105],['SOM',som,180]].map(([k,v,y])=>`<text x="262" y="${y}" font-family="Schibsted Grotesk,Arial" font-weight="800" font-size="16" fill="var(--wk)">${k}</text><text x="262" y="${y+20}" font-family="Schibsted Grotesk,Arial" font-size="14" fill="var(--ink)">AED ${f(v)}</text>`).join('')}
    </svg>`;
    el.querySelector('#c-out').innerHTML=`TAM = ${f(st.n)} × ${f(st.p)} = <b>AED ${f(tam)}</b><br>SAM = ${f(samN)} customers × ${f(st.p)} = <b>AED ${f(sam)}</b><br>SOM = ${f(somN)} customers × ${f(st.p)} = <b>AED ${f(som)}</b>`;
    store.set(key,JSON.stringify(st)); };
  el.querySelectorAll('[data-k]').forEach(i=>i.addEventListener('input',()=>{ st[i.dataset.k]=Math.max(0,+i.value||0); draw(); }));
  draw();
}

const DATA={'UAE':[
  ['Bayanat','The official UAE open data portal (bayanat.ae): population, education, health and economy data from federal and local bodies.'],
  ['Dubai Pulse','Dubai’s open data platform (dubaipulse.gov.ae): transport, tourism, population and city services.'],
  ['Federal Competitiveness and Statistics Centre','The UAE federal statistics body: national population and economic figures.'],
  ['Dubai Statistics Center','Official statistics for the Emirate of Dubai: population, labour, prices.']],
 'World':[
  ['World Bank Open Data','data.worldbank.org: population, income, education and business indicators by country and year.'],
  ['UN SDG Global Database','Official data for every SDG indicator, by country. Useful for your sustainability section too.']]};

const FORCES={center:'Food delivery in the UAE',branches:[
  {t:'Rivalry among firms',items:['Talabat, Careem, Deliveroo and others compete','Discounts and free delivery offers','<b>High</b>']},
  {t:'Threat of new entrants',items:['An app is easy to copy','Riders, restaurants and users are hard to win','<b>Medium</b>']},
  {t:'Power of buyers',items:['Users switch apps in seconds','Compare prices on two phones','<b>High</b>']},
  {t:'Power of suppliers',items:['Popular restaurants can choose apps','Riders can move to another platform','<b>Medium</b>']},
  {t:'Threat of substitutes',items:['Cook at home','Eat at the restaurant or campus canteen','<b>Medium</b>']}]};

const FIX=[
  {q:'“Our market is everyone in the UAE.”',type:'too broad',hint:'Name the customer with the need: “riders who work midday shifts in Dubai”. Then count them.'},
  {q:'“TAM is AED 1 billion.” No source.',type:'no evidence',hint:'Show the calculation (customers × price) and name the open data source and year.'},
  {q:'“We have no competitors.”',type:'blind spot',hint:'Every need is solved somehow today. List substitutes too, even “do nothing”.'},
  {q:'“We will win 50% of the market in year one.”',type:'too optimistic',hint:'Start small and explain why: how many customers can your team really reach in a year?'}];

function reflect(qs,exit){ return `<div class="stack ui">${qs.map((q,i)=>`<div class="feedback"><b>Q${i+1}</b> ${q}</div>`).join('')}<div class="box exam"><b class="lbl">Exit question</b>${exit}</div></div>`; }

Lecture.mount({
  id:'ent141-w12', week:12, clo:'3', course:'ENT 141', short:'Week 12 · Market/Industry Analysis',
  title:'Market/Industry Analysis', meta:'Byers et al. (2019), Porter (2008) · 2-hour lecture',
  scenes:[
  { nav:'Start here', title:'Is there a market for your idea?', minutes:5,
    narration:[`Today your team sizes the market for its chosen idea and looks at the industry around it. This is section 3 of Project 2. <span class="mono">Topics: Market vs Industry · TAM, SAM, SOM · Five Forces. CLO 3.</span>`],
    think:`A friend wants to open a karak tea stand at the campus gate. Before spending any money, what would you count to know if enough people will buy?`,
    src:`Reading: Byers, T. H., Dorf, R. C., &amp; Nelson, A. J. (2019). <em>Technology ventures: From idea to enterprise</em> (5th ed.). McGraw-Hill.`,
    fig:{label:`Today's lecture · 120 minutes`, build:el=>W.agenda(el,[[`Start here`,5,'l'],[`Market vs industry`,10,'l'],[`TAM, SAM, SOM`,10,'l'],[`Size it step by step`,15,'l'],[`Find real data`,10,'l'],[`Five forces`,15,'l'],[`Mistake → fix`,5,'l'],[`Project 2 · section 3`,40,'a'],[`Think about it`,10,'a']])} },

  { nav:'Market vs industry', title:'Market vs industry', minutes:10,
    narration:[`A <b>market</b> is the customers who have a need and can pay. An <b>industry</b> is the firms selling similar products. Uber agreed to buy Careem (March 2019, US$3.1 billion): the industry changed, riders’ need did not.`],
    src:`Byers et al. (2019). · Uber Technologies (2019, March 26). Uber to acquire Careem [Press release].`,
    fig:{label:`Two sides of the same exchange`, html:MKT_IND} },

  { nav:'TAM, SAM, SOM', title:'Market size: TAM, SAM, SOM', minutes:10,
    narration:[`<b>TAM</b> is everyone with the need. <b>SAM</b> is the part your offer can reach (place, language, channel). <b>SOM</b> is the share you can realistically win in the first year.`],
    src:`Byers et al. (2019): market size and opportunity assessment.`,
    fig:{label:`From everyone to your first customers`, html:FUNNEL} },

  { nav:'Size it step by step', title:'Size it step by step', minutes:15,
    narration:[`Running example: a shaded rest point with cold water for delivery riders, AED 20 a month (AED 240 a year). Multiply customers by price, then narrow twice. Change the numbers and watch the circles.`],
    fig:{label:`Market size calculator · illustrative numbers`, build:sizeCalc, caption:`Illustrative numbers only, not real data. Your team must use real figures with a source.`} },

  { nav:'Find real data', title:'Where to find real numbers', minutes:10,
    narration:[`Count customers with <b>official open data</b>, then write the source and year next to each number. Prices come from your interviews or from competitors’ public prices. More sources in the <a href="toolkit.html#s4">open data finder</a>.`],
    fig:{label:`Trusted open data · click to read`, build:el=>W.picker(el,DATA,'Select a source.')} },

  { nav:'Five forces', title:'Porter’s five forces (light)', minutes:15,
    narration:[`Porter’s <b>five forces</b> show how hard it is to make money in an industry. Rate each force low, medium or high, with one reason. Applied here to food delivery apps.`],
    src:`Porter, M. E. (2008). The five competitive forces that shape strategy. <em>Harvard Business Review</em>, 86(1), 78–93.`,
    fig:{label:`Five forces · our class rating`, mindmap:FORCES, caption:`Ratings are a class discussion, not data. Your team rates its own industry.`} },

  { nav:'Mistake → fix', title:'Mistake → fix', kind:'review', minutes:5,
    narration:[`These four mistakes appear in many market sections. Say the fix out loud before you reveal it.`],
    fig:{label:`Common mistakes · reveal the fix`, build:el=>W.practice(el,FIX,{label:'Fix',prefix:''})} },

  { nav:'Project 2 · section 3', title:'Activity · Project 2, section 3 draft', kind:'activity', minutes:40, wide:true,
    narration:[`Work on your team’s chosen idea from section 2. Use the calculator with real numbers, then write the draft here. Paste it into section 3 of the <a href="project-2.html">Project 2 builder</a>.`],
    fig:{label:`Market and industry analysis · saves in your browser`, build:el=>W.worksheet(el,{id:'ent141-w12-market',title:'ENT 141 · Project 2 · Section 3 · Market and industry analysis',fields:[
      {l:'Our customer (who has the need and pays)',rows:2},
      {l:'TAM: number of customers × price per year = AED …',rows:2},
      {l:'SAM and SOM: who we can reach, and what share we win in year 1',rows:3},
      {l:'Sources: open data portal, table name, year',rows:2},
      {l:'Five forces: the two strongest forces and why',rows:3}]})} },

  { nav:'Think about it', title:'Think about it', kind:'review', minutes:10,
    narration:[`Discuss with your team. There is no single right answer.`,`<b>Next week:</b> Value Proposition Canvas, part 1. Bring your Project 1 interview notes and empathy map.<br><a class="btn" href="week-13.html">Next lecture · Week 13 · Value Proposition Canvas (Part 1) →</a>`],
    fig:{label:`Reflection`, html:reflect([`Your SOM looks very small. Is that bad news for a social venture?`,`Which of the five forces could stop your idea, and what could your team do about it?`,`Where did your price come from: a guess, an interview or a competitor?`],`In one sentence: who exactly is in your SAM?`)} },
  ]
});
</script>
</body>
</html>
