<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Week 11 · Overview of Entrepreneurial Strategies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Schibsted+Grotesk:wght@400;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<link rel="stylesheet" href="assets/course.css">
<style>
:root{--wk:#0E6E8C;--wk-soft:rgba(14,110,140,.10);--wk-d:#6CD3F0;--wk-soft-d:rgba(108,211,240,.14)}
</style>
</head>
<body>
<script src="assets/site.js"></script>
<script src="assets/supports.js"></script>
<script src="assets/course.js"></script>
<script src="assets/onepage.js"></script>
<script src="assets/ent141.js"></script>
<script src="assets/kb.js"></script>
<script src="assets/search-index.js"></script>
<script src="assets/assistant.js"></script>
<script>
const {W} = Lecture; const {store,esc} = ENT141;
const F='font-family="Schibsted Grotesk,Arial"';

const MAP={center:'Strategies new ventures use',branches:[
  {t:'Blue ocean',items:['Create a new market space','Cirque du Soleil']},
  {t:'Lean startup',items:['Build, measure, learn, repeat','Zappos tested before building']},
  {t:'Imitation with improvement',items:['Copy what works, fix one thing','Google after AltaVista']},
  {t:'Platform or marketplace',items:['Connect two groups of users','Careem, Talabat']},
  {t:'Social enterprise',items:['Social or environmental value is the goal','Grameen Bank, TOMS']}]};

/* Blue ocean ERRC grid (Kim & Mauborgne, 2005) */
const ERRC=`<div class="cmp"><div><h4>Eliminate</h4>Animal acts and star performers</div><div><h4>Reduce</h4>Thrill and danger</div><div><h4>Raise</h4>A unique venue</div><div><h4>Create</h4>A story theme, artistic music and dance</div></div>`;

/* Lean startup loop (Ries, 2011) */
const SVG_LOOP=`<svg viewBox="0 0 520 300" role="img" aria-label="Build, measure, learn loop">
  <defs><marker id="ah11" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--wk)"/></marker></defs>
  <path d="M302 70 C370 90 395 140 388 188" fill="none" stroke="var(--wk)" stroke-width="3" marker-end="url(#ah11)"/>
  <path d="M345 255 C300 290 220 290 177 255" fill="none" stroke="var(--wk)" stroke-width="3" marker-end="url(#ah11)"/>
  <path d="M132 190 C125 140 160 85 218 68" fill="none" stroke="var(--wk)" stroke-width="3" marker-end="url(#ah11)"/>
  <circle cx="260" cy="55" r="44" fill="var(--wk)"/><text x="260" y="62" text-anchor="middle" ${F} font-weight="800" font-size="18" style="fill:var(--on-wk)">Build</text>
  <circle cx="135" cy="235" r="44" fill="var(--wk-soft)" stroke="var(--wk)" stroke-width="2"/><text x="135" y="242" text-anchor="middle" ${F} font-weight="800" font-size="17">Learn</text>
  <circle cx="385" cy="235" r="44" fill="var(--wk-soft)" stroke="var(--wk)" stroke-width="2"/><text x="385" y="242" text-anchor="middle" ${F} font-weight="800" font-size="17">Measure</text>
  <text x="260" y="160" text-anchor="middle" ${F} font-size="13" class="t-muted">smallest test first:</text>
  <text x="260" y="180" text-anchor="middle" ${F} font-weight="700" font-size="14">minimum viable product</text>
</svg>`;

/* Two-sided platform */
const SVG_PLAT=`<svg viewBox="0 0 560 200" role="img" aria-label="A platform connects two groups: customers and captains, through the Careem app">
  <defs><marker id="ah11b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--wk)"/></marker></defs>
  <rect x="10" y="60" width="140" height="80" rx="12" fill="var(--wk-soft)" stroke="var(--wk)" stroke-width="2"/>
  <text x="80" y="97" text-anchor="middle" ${F} font-weight="800" font-size="16">Customers</text>
  <text x="80" y="118" text-anchor="middle" ${F} font-size="12" class="t-muted">need a ride</text>
  <rect x="205" y="45" width="150" height="110" rx="55" fill="var(--wk)"/>
  <text x="280" y="96" text-anchor="middle" ${F} font-weight="800" font-size="17" style="fill:var(--on-wk)">Platform</text>
  <text x="280" y="118" text-anchor="middle" ${F} font-size="13" style="fill:var(--on-wk)">the Careem app</text>
  <rect x="410" y="60" width="140" height="80" rx="12" fill="var(--wk-soft)" stroke="var(--wk)" stroke-width="2"/>
  <text x="480" y="97" text-anchor="middle" ${F} font-weight="800" font-size="16">Captains</text>
  <text x="480" y="118" text-anchor="middle" ${F} font-size="12" class="t-muted">want to earn</text>
  <line x1="153" y1="100" x2="200" y2="100" stroke="var(--wk)" stroke-width="3" marker-start="url(#ah11b)" marker-end="url(#ah11b)"/>
  <line x1="360" y1="100" x2="407" y2="100" stroke="var(--wk)" stroke-width="3" marker-start="url(#ah11b)" marker-end="url(#ah11b)"/>
  <text x="280" y="188" text-anchor="middle" ${F} font-size="13" class="t-muted">The platform earns a fee for each match.</text>
</svg>`;

const IMIT=[
  {t:'Others go first',s:'1995',d:'Search engines such as AltaVista already let people search the web.'},
  {t:'Copy what works',s:'1998',d:'Google kept the simple idea: type words, get a list of pages.'},
  {t:'Improve one thing',s:'PageRank',d:'Google ranked pages by the links pointing to them, so better pages came first.'},
  {t:'Win on the improvement',s:'result',d:'Better results, not being first, is what users noticed.'}];

const SOC={'Social enterprise models':[
  ['Grameen Bank · microcredit','Muhammad Yunus started lending very small amounts to poor villagers in Bangladesh, mostly women, without collateral. Yunus and the bank shared the 2006 Nobel Peace Prize.'],
  ['TOMS · one-for-one','For each pair of shoes sold, TOMS gave a pair to a child in need. In 2019 it dropped this model and now gives one third of net profits to grassroots groups.']]};

const FRAME=[
  {t:'Venture and problem',s:'Q1',d:'Who started it, and which problem does it solve, for whom?'},
  {t:'Name the strategy',s:'Q2',d:'Use a name from Weeks 10–11: cost leadership, differentiation, focus, blue ocean, lean, imitation, platform, social enterprise.'},
  {t:'Evidence',s:'Q3',d:'Quote or point to two facts in the text that show this strategy.'},
  {t:'Social or environmental value',s:'Q4',d:'Which SDG, and which target? Who benefits?'},
  {t:'Lesson for our team',s:'Q5',d:'One thing your team will copy or avoid in Project 2.'}];

const FIX=[
  {q:'“The strategy is blue ocean.” (nothing else)',hint:'A name without evidence earns little. Add two facts from the text that show it.'},
  {q:'Half a page retelling the story of the case.',hint:'Summary is not analysis. One or two lines on the story, then answer the five questions.'},
  {q:'“It helps the SDGs.”',hint:'Name one SDG and one target, for example SDG 12, target 12.3 (food waste).'},
  {q:'“Lesson: work hard and never give up.”',hint:'Too general. Tie it to your own team idea: what will you do differently?'}];

const CASE=`<div class="box plain" style="border-style:dashed"><b class="lbl">Fictional case · written for practice only</b>
<p><b>Second Loaf.</b> Three students in Sharjah saw bakeries near campus throw away bread every night. They tested an idea with <b>one</b> bakery for two weeks: at 9 pm the bakery posts its unsold bread in a WhatsApp channel, and families reserve a bag at half price and collect it.</p>
<p>Second Loaf keeps a small fee for each bag. Bread nobody reserves goes to a community fridge. After the test, four more bakeries asked to join.</p></div>`;

Lecture.mount({
  id:'ent141-w11', week:11, clo:'1, 3, 4', course:'ENT 141', short:'Week 11 · Overview of Strategies', instructor:'Nadia',
  title:'Overview of Entrepreneurial Strategies', meta:'Byers et al (2019), Kim & Mauborgne (2005), Ries (2011) · 2-hour lecture · Activity 2',
  scenes:[
  { nav:'Start here', title:'How do new ventures choose how to win?', minutes:5,
    narration:[`Today: a map of five strategy types, a way to read any case, and your team's three ideas for Project 2. <span class="mono">Topics: Strategy map · Case reading · Activity 2. CLO 1 · CLO 3 · CLO 4.</span>`],
    think:`Open your phone. A ride app, a food app, a brand that gives part of its profit to charity. Each one wins in a different way. Can you say how?`,
    src:`Reading: Byers, T. H., Dorf, R. C., &amp; Nelson, A. J. (2019). <em>Technology ventures</em> (5th ed.).`,
    fig:{label:`Today's lecture · 120 minutes`, build:el=>W.agenda(el,[[`Start here`,5,'l'],[`Strategy map`,5,'l'],[`Blue ocean`,10,'l'],[`Lean startup`,10,'l'],[`Imitation`,5,'l'],[`Platform`,10,'l'],[`Social enterprise`,10,'l'],[`Read a case`,10,'l'],[`Mistake and fix`,5,'l'],[`Practice case`,20,'a'],[`Pick three ideas`,25,'a'],[`Think about it`,5,'a']])} },

  { nav:'Strategy map', title:'A map of strategy types', minutes:5,
    narration:[`New ventures often combine Porter's choices with one of five common strategy types. Open each branch: what it means, and one real example.`],
    fig:{label:`Concept · strategy map`, mindmap:MAP} },

  { nav:'Blue ocean', title:'Blue ocean strategy', minutes:10,
    narration:[`A <b>red ocean</b> is a crowded market where rivals fight. A <b>blue ocean</b> is a new market space with no direct rivals. Cirque du Soleil removed what circuses cost most and added theatre.`],
    src:`Kim, W. C., &amp; Mauborgne, R. (2005). <em>Blue ocean strategy</em>. Harvard Business School Press (Cirque du Soleil; the eliminate-reduce-raise-create grid).`,
    fig:{label:`Concept · Cirque du Soleil's four actions`, html:ERRC} },

  { nav:'Lean startup', title:'Lean startup: build, measure, learn', minutes:10,
    narration:[`Test the smallest version first, learn, then change or <b>pivot</b>. Zappos first photographed shoes in local shops and bought a pair only when someone ordered online.`],
    src:`Ries, E. (2011). <em>The lean startup</em>. Crown (build-measure-learn; minimum viable product; Zappos).`,
    fig:{label:`Concept · the loop`, html:SVG_LOOP} },

  { nav:'Imitation', title:'Imitation with improvement', minutes:5,
    narration:[`You do not need to be first. Copy an idea that already works, then improve the one thing users dislike. Google was not the first search engine.`],
    src:`Brin, S., &amp; Page, L. (1998). The anatomy of a large-scale hypertextual web search engine. <em>Computer Networks and ISDN Systems</em>, 30, 107–117.`,
    fig:{label:`Real example · click or play`, flow:IMIT} },

  { nav:'Platform', title:'Platform or marketplace', minutes:10,
    narration:[`A <b>platform</b> connects two groups that need each other. Careem links riders and captains; Uber announced it would buy Careem in March 2019 for US$3.1 billion. Talabat links diners, restaurants and riders.`],
    src:`VentureBeat (2019, March). Uber confirms it's acquiring Middle East rival Careem for $3.1 billion. · Delivery Hero SE (2024). <em>Annual report 2023</em> (Talabat).`,
    fig:{label:`Concept · two sides, one platform`, html:SVG_PLAT} },

  { nav:'Social enterprise', title:'Social enterprise models', minutes:10,
    narration:[`A <b>social enterprise</b> sells or lends like a business, but its main goal is social or environmental value. Compare two models. Which one fixes a cause, and which one a symptom?`],
    src:`Nobel Prize Outreach (2006). The Nobel Peace Prize 2006: Muhammad Yunus and Grameen Bank. · Retail Brew (2019, November 22). Toms is ending its “One for One” giving program.`,
    fig:{label:`Real examples · click to compare`, build:el=>W.picker(el,SOC,'Select a model.')} },

  { nav:'Read a case', title:'How to read a case: five questions', minutes:10,
    narration:[`Read the case twice. First for the story, then with these five questions. They are the same five questions as <a href="activity-2.html">Activity 2</a>.`],
    src:`Activity 2 · Article or case analysis (10%, individual), due Thu 19 Nov, 23:59, on Moodle.`,
    fig:{label:`Case reading frame · click or play`, flow:FRAME} },

  { nav:'Mistake and fix', title:'Common mistake → fix', kind:'review', minutes:5,
    narration:[`These four mistakes cost marks in case analysis. Say the fix first, then reveal it.`],
    fig:{label:`Mistake → fix`, build:el=>W.practice(el,FIX,{label:'Fix',prefix:'<b>Fix:</b> '})} },

  { nav:'Practice case', title:'Practice · Read a mini-case', kind:'activity', minutes:20, wide:true,
    narration:[`Read the fictional case, then answer the five questions. More than one strategy can fit; your evidence decides.`, CASE],
    fig:{label:`Five questions · saves in your browser`, build:el=>W.worksheet(el,{id:'ent141-w11-case',title:'ENT 141 · Week 11 · Practice case: Second Loaf (fictional)',fields:[
      {l:'Q1 · The venture and its problem',rows:2},
      {l:'Q2 · The strategy it used (name it)',rows:2},
      {l:'Q3 · Evidence from the text (two facts)',rows:2},
      {l:'Q4 · Social or environmental value (SDG and target)',rows:2},
      {l:'Q5 · One lesson for our own team idea',rows:2}]})} },

  { nav:'Pick three ideas', title:'Activity · Pick your three social innovation ideas', kind:'activity', minutes:25, wide:true,
    narration:[`Team task. Start from last week's three directions. Choose three social innovation ideas for your Project 1 problem and name a strategy for each. This is section 1 of <a href="project-2.html">Project 2</a>.`],
    fig:{label:`Team worksheet · saves in your browser`, build:el=>W.worksheet(el,{id:'ent141-w11-ideas',title:'ENT 141 · Week 11 · Three social innovation ideas',fields:[
      {l:'Our Project 1 problem (one sentence)',rows:2},
      {l:'Idea 1 · what it is + strategy type',rows:2},
      {l:'Idea 2 · what it is + strategy type',rows:2},
      {l:'Idea 3 · what it is + strategy type',rows:2},
      {l:'Main SDG our ideas serve',rows:1},
      {l:'Who already does something similar?',rows:2}]})} },

  { nav:'Think about it', title:'Think about it', kind:'review', minutes:5,
    narration:[`Discuss with your team, then reveal one view. <b>Exit question:</b> which strategy type fits your favourite idea, and what is your evidence?`,
      `<b>Next week:</b> Market/Industry Analysis: how big is the market for your idea? Bring your three ideas. Activity 2 is due Thu 19 Nov, 23:59.`,
      `<a class="btn" href="week-12.html">Next lecture · Week 12 · Market/Industry Analysis →</a>`],
    fig:{label:`Reflection · strategies`, build:el=>W.practice(el,[
      {q:'TOMS gave shoes for years, then changed its model. Why might giving products not solve the problem?',hint:'Free products can miss the cause, such as income or local jobs. Ask what the users really need.'},
      {q:'Is a platform a good fit for a small student team?',hint:'Only if you can attract both sides at once. Start with one small group of each.'},
      {q:'Which of your three ideas could you test this week with a lean test?',hint:'Pick the one you can show to real users fastest and most cheaply.'}],{label:'One view',prefix:''})} },
  ]
});
</script>
</body>
</html>
