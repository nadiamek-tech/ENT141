<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Week 11 · Overview of Entrepreneurial Strategies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Schibsted+Grotesk:wght@400;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<link rel="stylesheet" href="assets/course.css">
<style>
:root{--wk:#0E6E8C;--wk-soft:rgba(14,110,140,.10);--wk-d:#6CD3F0;--wk-soft-d:rgba(108,211,240,.14)}
/* case card */
.cc{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface);font-family:var(--f-display);max-width:100%}
.cc-h{display:flex;gap:14px;align-items:center;padding:12px 14px;background:var(--wk-soft);border-bottom:1px solid var(--line)}
.cc-h .mini{flex:none;width:64px;height:64px}
.cc-h .mini svg{width:100%;height:100%;display:block}
.cc-h .who{min-width:0}
.cc-h .eb{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--wk);font-weight:600}
.cc-h b{display:block;font-size:1.2rem;font-weight:800;color:var(--ink);line-height:1.15}
.cc-h small{display:block;font-family:var(--f-mono);font-size:.74rem;color:var(--muted);margin-top:2px}
.cc dl{margin:0}
.cc-r{display:grid;grid-template-columns:132px minmax(0,1fr);gap:10px;padding:10px 14px;border-bottom:1px dashed var(--line);align-items:baseline}
.cc-r:last-child{border-bottom:0}
.cc-r dt{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.cc-r dd{margin:0;font-size:.95rem;line-height:1.4;color:var(--ink)}
.cc-r.ls{background:var(--wk-soft)}
.cc-r.ls dt{color:var(--wk)}
.cc-r.ls dd{font-weight:700}
@media (max-width:520px){.cc-r{grid-template-columns:minmax(0,1fr);gap:2px}.cc-h .mini{width:52px;height:52px}}
/* reading boxes */
.rc{border:1px solid var(--line);border-left:4px solid var(--wk);border-radius:10px;padding:12px 16px;background:var(--surface);font-size:.98rem;line-height:1.55}
.rc.fic{border-style:dashed;border-left-style:solid}
.rc .lbl{display:block;font-family:var(--f-mono);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--wk);font-weight:600;margin-bottom:4px}
.rc p{margin:.4em 0}
</style>
</head>
<body>
<script src="assets/site.js"></script>
<script src="assets/supports.js"></script>
<script src="assets/course.js"></script>
<script src="assets/onepage.js"></script>
<script src="assets/ent141.js"></script>
<script src="assets/kb.js"></script>
<script src="assets/search-index.js"></script>
<script src="assets/assistant.js"></script>
<script>
const {W} = Lecture; const {store,esc} = ENT141;

const F='font-family="Schibsted Grotesk,Arial"';

/* ---------- strategies you can review against ---------- */
const MAP={center:'Strategies you can review against',branches:[
  {t:'Blue ocean',items:['Make a new market with no rivals','Cirque du Soleil']},
  {t:'Lean startup',items:['Test small, learn, change','Zappos']},
  {t:'Imitation with improvement',items:['Copy what works, fix one thing','Google']},
  {t:'Platform',items:['An app that links two groups','Talabat']},
  {t:'Social enterprise',items:['Social value is the main goal','Grameen Bank']}]};

/* ---------- four ways to communicate ---------- */
const COMM=[
  {t:'One line',s:'1',d:'A short sentence anyone can repeat. Test it on a friend.'},
  {t:'A story',s:'2',d:'Why you started. Use a real user from your interviews.'},
  {t:'Values',s:'3',d:'Two or three rules the team never breaks.'},
  {t:'Everywhere',s:'4',d:'The same words on the website, the app and the pitch.'}];

/* ---------- Collins & Porras: two parts of a vision ---------- */
const SVG_CP=`<svg viewBox="0 0 560 300" role="img" aria-label="Collins and Porras: a vision has a core ideology that stays and an envisioned future to aim for">
  <rect x="20" y="40" width="240" height="220" rx="12" fill="var(--wk)"/>
  <text x="140" y="80" text-anchor="middle" ${F} font-weight="800" font-size="18" style="fill:var(--on-wk)">Core ideology</text>
  <text x="140" y="104" text-anchor="middle" ${F} font-size="13" style="fill:var(--on-wk)">what never changes</text>
  <text x="140" y="160" text-anchor="middle" ${F} font-weight="700" font-size="15" style="fill:var(--on-wk)">Core values</text>
  <text x="140" y="200" text-anchor="middle" ${F} font-weight="700" font-size="15" style="fill:var(--on-wk)">Core purpose</text>
  <rect x="300" y="40" width="240" height="220" rx="12" fill="var(--wk-soft)" stroke="var(--wk)" stroke-width="2"/>
  <text x="420" y="80" text-anchor="middle" ${F} font-weight="800" font-size="18">Envisioned future</text>
  <text x="420" y="104" text-anchor="middle" ${F} font-size="13" class="t-muted">where we aim to go</text>
  <text x="420" y="160" text-anchor="middle" ${F} font-weight="700" font-size="15">One big, bold goal</text>
  <text x="420" y="200" text-anchor="middle" ${F} font-weight="700" font-size="15">A vivid picture of it</text>
  <text x="280" y="26" text-anchor="middle" ${F} font-weight="700" font-size="14" class="t-muted">A clear vision has two parts</text>
</svg>`;

/* ---------- review loop ---------- */
const SVG_LOOP=`<svg viewBox="0 0 560 320" role="img" aria-label="Strategy review loop: plan, act, check goals against results, then keep, change or stop">
  <defs><marker id="la" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--wk)"/></marker></defs>
  <circle cx="280" cy="160" r="105" fill="none" stroke="var(--line)" stroke-width="2" stroke-dasharray="6 6"/>
  <path d="M346 78 A105 105 0 0 1 381 132" fill="none" stroke="var(--wk)" stroke-width="3" marker-end="url(#la)"/>
  <path d="M381 190 A105 105 0 0 1 346 240" fill="none" stroke="var(--wk)" stroke-width="3" marker-end="url(#la)"/>
  <path d="M200 228 A105 105 0 0 1 177 180" fill="none" stroke="var(--wk)" stroke-width="3" marker-end="url(#la)"/>
  <path d="M183 120 A105 105 0 0 1 210 82" fill="none" stroke="var(--wk)" stroke-width="3" marker-end="url(#la)"/>
  <rect x="215" y="28" width="130" height="44" rx="10" fill="var(--wk)"/>
  <text x="280" y="56" text-anchor="middle" ${F} font-weight="800" font-size="16" style="fill:var(--on-wk)">1 · Plan</text>
  <rect x="380" y="140" width="160" height="44" rx="10" fill="var(--wk-soft)" stroke="var(--wk)" stroke-width="2"/>
  <text x="460" y="168" text-anchor="middle" ${F} font-weight="800" font-size="16">2 · Act</text>
  <rect x="190" y="246" width="180" height="58" rx="10" fill="var(--wk-soft)" stroke="var(--wk)" stroke-width="2"/>
  <text x="280" y="270" text-anchor="middle" ${F} font-weight="800" font-size="16">3 · Check</text>
  <text x="280" y="290" text-anchor="middle" ${F} font-size="12" class="t-muted">goals vs results</text>
  <rect x="10" y="130" width="160" height="58" rx="10" fill="none" stroke="var(--wk)" stroke-width="2"/>
  <text x="90" y="154" text-anchor="middle" ${F} font-weight="800" font-size="16">4 · Decide</text>
  <text x="90" y="174" text-anchor="middle" ${F} font-size="12" class="t-muted">keep · change · stop</text>
</svg>`;

/* ---------- small icons for case cards ---------- */
const MINI_MEGA=`<svg viewBox="0 0 64 64" aria-hidden="true"><rect x="2" y="2" width="60" height="60" rx="12" fill="var(--wk-soft)"/><path d="M14 26 h8 l18 -10 v32 l-18 -10 h-8 z" fill="var(--wk)"/><path d="M46 24 q6 8 0 16" fill="none" stroke="var(--wk)" stroke-width="3" stroke-linecap="round"/></svg>`;

/* ---------- case card ---------- */
function caseCard(c){
  return `<article class="cc" aria-label="Case study: ${esc(c.org)}">
  <div class="cc-h"><div class="mini">${c.mini||''}</div><div class="who"><span class="eb">${c.tag}</span><b>${c.org}</b><small>${c.place} · ${c.year}</small></div></div>
  <dl><div class="cc-r"><dt>What they did</dt><dd>${c.did}</dd></div>
  <div class="cc-r"><dt>${c.whyLbl||'Why it worked'}</dt><dd>${c.why}</dd></div>
  <div class="cc-r ls"><dt>Lesson</dt><dd>${c.lesson}</dd></div></dl></article>`;
}

const CASE_PAT=caseCard({tag:'Case · communicating a purpose',org:'Patagonia',place:'USA',year:'purpose 2018 · ownership change 2022',mini:MINI_MEGA,
  did:'It shares one line: “We’re in business to save our home planet.” In 2022, the founder wrote: “Earth is now our only shareholder.”',
  whyLbl:'Why it works',why:'One line, a story from the founder, and an action that proves it.',
  lesson:'Say it in one line. Then show it with actions.'});

/* ---------- Activity 2: five questions ---------- */
const CASEQ=[
  {t:'Venture and problem',s:'Q1',d:'Who started it? Which problem does it solve, and for whom?'},
  {t:'Name the strategy',s:'Q2',d:'Use one name from Weeks 10–11: cost, difference, focus, blue ocean, lean, imitation, platform, social enterprise.'},
  {t:'Evidence',s:'Q3',d:'Point to two facts in the text that show this strategy.'},
  {t:'Social or planet value',s:'Q4',d:'Which SDG (UN goal for 2030)? Who benefits?'},
  {t:'Lesson for us',s:'Q5',d:'One thing your team will copy or avoid in Project 2.'}];

/* ---------- in-depth case (real, cited) ---------- */
const DEPTH=`<div class="rc"><span class="lbl">Real case · read it twice</span>
<p><b>TOMS: One for One, then a change.</b> In 2006, Blake Mycoskie visited Argentina. He met many children who had no shoes. Back in the USA, he started TOMS.</p>
<p>The idea was called One for One. For each pair a customer bought, TOMS gave a pair to a child in need. Customers liked shoes that also helped someone. The brand grew fast. In 2011, TOMS added glasses, with a similar giving model.</p>
<p>Later, critics asked hard questions. Free shoes do not fix poverty. Free shoes may also hurt local shoe sellers. One study in El Salvador found the shoes changed little for children.</p>
<p>In 2019, TOMS ended One for One. It now gives one third of its profits to local groups. These groups work on causes such as mental health.</p></div>`;

/* ---------- practice case (fictional) ---------- */
const CASE_FIC=`<div class="rc fic"><span class="lbl">Fictional case · for practice only</span>
<p><b>Second Loaf.</b> Three students in Sharjah saw bakeries throw away bread every night. They tested an idea with <b>one</b> bakery for two weeks.</p>
<p>At 9 pm, the bakery posts its leftover bread in a WhatsApp channel. Families reserve a bag at half price. Second Loaf keeps a small fee per bag.</p>
<p>Bread nobody reserves goes to a community fridge. After the test, four more bakeries asked to join.</p></div>`;

const FIX=[
  {q:'“The strategy is blue ocean.” Nothing else.',hint:'A name alone earns little. Add two facts from the text that show it.'},
  {q:'Half a page retelling the story of the case.',hint:'A summary is not analysis. Two lines of story. Then answer the five questions.'},
  {q:'“It helps the SDGs.”',hint:'Name one SDG and one target. Example: SDG 12, target 12.3 (food waste).'},
  {q:'“Lesson: work hard and never give up.”',hint:'Too general. Link the lesson to your own team idea.'}];

Lecture.mount({
  id:'ent141-w11', week:11, clo:'1, 3, 4', course:'ENT 141', short:'Week 11 · Overview of Strategies', instructor:'Nadia',
  title:'Overview of Entrepreneurial Strategies', meta:'Collins &amp; Porras (1996), Harvard Business Review · 2-hour lecture · Activity 2',
  scenes:[
  { nav:'Start here', title:'How do ventures share and check their strategy?', minutes:5,
    narration:[`Last week: vision, mission, goals, objectives, tactics. Today: how to communicate them, and how to review them. Then Activity 2. <span class="mono">CLO 1 · CLO 3 · CLO 4.</span>`],
    think:`Open an app you use daily. Can you find one sentence saying why it exists? Where did you see it?`,
    src:`Reading: Collins, J. C., &amp; Porras, J. I. (1996). Building your company's vision. <em>Harvard Business Review</em>, 74(5), 65–77.`,
    fig:{label:`Today's lecture · 120 minutes`, build:el=>W.agenda(el,[[`Start here`,5,'l'],[`Two parts of a vision`,7,'l'],[`Communicate it`,8,'l'],[`Real case: Patagonia`,6,'l'],[`Review the strategy`,8,'l'],[`Keep · change · stop`,15,'a'],[`Strategies to review against`,6,'l'],[`Read a case`,5,'l'],[`Mistake → fix`,5,'c'],[`Practice case`,15,'a'],[`Team: three ideas`,30,'a'],[`Think about it`,10,'c']])} },

  { nav:'Two parts of a vision', title:'Two parts of a vision', minutes:7,
    narration:[`Collins and Porras split a vision in two. A <b>core ideology</b> that never changes. An <b>envisioned future</b> to aim for.`],
    src:`Collins, J. C., &amp; Porras, J. I. (1996). Building your company's vision. <em>Harvard Business Review</em>, 74(5), 65–77.`,
    fig:{label:`Concept · core ideology + envisioned future`, html:SVG_CP} },

  { nav:'Communicate it', title:'How ventures communicate vision and mission', minutes:8,
    narration:[`A mission only works if people hear it. Ventures use four tools. Click each one.`],
    src:`Collins &amp; Porras (1996). · Byers et al. (2019), Ch. 3.`,
    fig:{label:`Concept · four ways to communicate · click or play`, flow:COMM} },

  { nav:'Real case: Patagonia', title:'Real case · Patagonia', minutes:6,
    narration:[`Patagonia shows its purpose in words and actions. Find the one line, the story and the action.`],
    src:`Patagonia. (n.d.). <em>Our purpose</em>. · Chouinard, Y. (2022, September 14). <em>Earth is now our only shareholder</em>. patagonia.com.`,
    fig:{label:`Case study · communicating a purpose`, html:CASE_PAT} },

  { nav:'Review the strategy', title:'Reviewing the strategy', minutes:8,
    narration:[`A strategy is never finished. Check your objectives against real results. Then decide: <b>keep</b>, <b>change</b> or <b>stop</b>.`],
    src:`Byers et al. (2019), Ch. 3. · Ries, E. (2011). <em>The lean startup</em>. Crown (build-measure-learn).`,
    fig:{label:`Concept · the review loop`, html:SVG_LOOP} },

  { nav:'Keep · change · stop', title:'Case study in depth · TOMS reviews its strategy', kind:'activity', minutes:15, wide:true,
    narration:[`Read the real case twice. Find where TOMS checked results and changed. Answer alone, then compare.`, DEPTH],
    src:`Mycoskie, B. (2011). <em>Start something that matters</em>. Spiegel &amp; Grau. · Retail Brew. (2019, November 22). Toms is ending its “One for One” giving program. · Wydick, B., et al. (2018). Shoeing the children: The impact of the TOMS shoe donation program in rural El Salvador. <em>World Bank Economic Review</em>.`,
    fig:{label:`Three questions · saves in your browser`, build:el=>W.worksheet(el,{id:'ent141-w11-toms',title:'ENT 141 · Week 11 · Case study in depth: TOMS',fields:[
      {l:'Q1 · What was the TOMS mission in 2006? Give one fact.',rows:2},
      {l:'Q2 · What did the results show? Keep, change or stop?',rows:2},
      {l:'Q3 · Did the 2019 change make TOMS better at helping? Why?',rows:2}]})} },

  { nav:'Strategies to review against', title:'Strategies you can review against', minutes:6,
    narration:[`When you review, compare your plan with known strategies. Click each branch for its meaning and one real case.`],
    src:`Kim, W. C., &amp; Mauborgne, R. (2005). <em>Blue ocean strategy</em>. Harvard Business School Press. · Ries (2011). · Nobel Prize Outreach. (2006). <em>The Nobel Peace Prize 2006</em>: Muhammad Yunus and Grameen Bank.`,
    fig:{label:`Concept · strategy map`, mindmap:MAP} },

  { nav:'Read a case', title:'Read a case: five questions', minutes:5,
    narration:[`Read a case twice. First for the story. Then answer these five questions. They are <a href="activity-2.html">Activity 2</a>: in class today, due Thu 19 Nov, 23:59.`,
      `<a class="btn" href="activity-2.html">Open Activity 2 →</a>`],
    src:`ENT 141 Activity 2 · Article or case analysis (10%, individual, in-class activity), submitted on Moodle.`,
    fig:{label:`Five questions · click or play`, flow:CASEQ} },

  { nav:'Mistake → fix', title:'Mistake → fix', kind:'review', minutes:5,
    narration:[`These four mistakes cost marks in Activity 2. Say the fix first, then reveal it.`],
    src:`United Nations. (2015). <em>Transforming our world: The 2030 agenda for sustainable development</em> (SDG target 12.3).`,
    fig:{label:`Common mistakes · reveal the fix`, build:el=>W.practice(el,FIX,{label:'Fix',prefix:'<b>Fix:</b> '})} },

  { nav:'Practice case', title:'Practice · Read a mini-case', kind:'activity', minutes:15, wide:true,
    narration:[`Read the fictional case. Answer the five questions. More than one strategy can fit. Your evidence decides.`, CASE_FIC],
    fig:{label:`Five questions · saves in your browser`, build:el=>W.worksheet(el,{id:'ent141-w11-case',title:'ENT 141 · Week 11 · Practice case: Second Loaf (fictional)',fields:[
      {l:'Q1 · The venture and its problem',rows:2},
      {l:'Q2 · The strategy it used (name it)',rows:2},
      {l:'Q3 · Evidence from the text (two facts)',rows:2},
      {l:'Q4 · Social or planet value (which SDG?)',rows:2},
      {l:'Q5 · One lesson for our team idea',rows:2}]})} },

  { nav:'Team: three ideas', title:'Team · Three social innovation ideas', kind:'activity', minutes:30, wide:true,
    narration:[`Start from last week's ladder. Write three ideas for your Project 1 problem. Check each against your mission. Then score them.`,
      `<a class="btn" href="project-2.html#p-s1">Copy into Project 2, sections 1 and 2 →</a>`],
    fig:{label:`Team worksheet · saves in your browser`, build:el=>W.worksheet(el,{id:'ent141-w11-ideas',title:'ENT 141 · Week 11 · Three social innovation ideas',fields:[
      {l:'Our mission in one line',rows:1},
      {l:'Idea 1 · what it is + its strategy',rows:2},
      {l:'Idea 2 · what it is + a different strategy',rows:2},
      {l:'Idea 3 · what it is + a different strategy',rows:2},
      {l:'Main SDG our ideas serve',rows:1},
      {l:'Quick score (Week 8 table): which idea fits our mission best, and why?',rows:2}]})} },

  { nav:'Think about it', title:'Think about it', kind:'review', minutes:10,
    narration:[`Discuss with your team. There is no single right answer.`,
      `<b>Exit question:</b> when will your team next check its objectives? What will you count?`,
      `<b>Next week:</b> Market/Industry Analysis. How big is the market for your idea? Activity 2 is due Thu 19 Nov, 23:59.`,
      `<a class="btn" href="week-12.html">Next lecture · Week 12 · Market/Industry Analysis →</a>`],
    fig:{label:`Reflection · strategies`, build:el=>W.practice(el,[
      {q:'Is changing a strategy a sign of failure?',hint:'No. TOMS changed after it checked results. Reviewing is part of the plan.'},
      {q:'Where would your users see your mission first?',hint:'Think of the place they meet you: an app screen, a poster, a pitch.'},
      {q:'Which idea could you test this week?',hint:'The one you can show to real users fastest and most cheaply.'}],{label:'One view',prefix:''})} },
  ]
});
</script>
</body>
</html>
