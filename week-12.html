<head>

<title>Week 12 · Market/Industry Analysis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Schibsted+Grotesk:wght@400;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<link rel="stylesheet" href="assets/course.css">
<style>
:root{--wk:#9D174D;--wk-soft:rgba(157,23,77,.09);--wk-d:#F9A8D4;--wk-soft-d:rgba(249,168,212,.14)}
.calc{display:grid;gap:8px;font-family:var(--f-display)}
.calc label{font-weight:600;font-size:.88rem}
.calc input{width:100%;min-width:0;border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:var(--surface);color:var(--ink);font:inherit;font-size:.92rem}
.calc .g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:560px){.calc .g2{grid-template-columns:minmax(0,1fr)}}
.calc svg{width:100%;height:auto;max-width:420px;display:block;margin:0 auto}
</style>
</head>
<body>
<script src="assets/site.js"></script>
<script src="assets/supports.js"></script>
<script src="assets/course.js"></script>
<script src="assets/onepage.js"></script>
<script src="assets/ent141.js"></script>
<script src="assets/kb.js"></script>
<script src="assets/search-index.js"></script>
<script src="assets/assistant.js"></script>
<script>
const {W} = Lecture; const {store,esc} = ENT141;

const MKT_IND=`<svg viewBox="0 0 520 230" role="img" aria-label="Market is the buyers; industry is the sellers" style="width:100%;height:auto">
  <text x="110" y="22" text-anchor="middle" font-family="Schibsted Grotesk,Arial" font-weight="700" font-size="15" fill="var(--wk)">MARKET · the buyers</text>
  ${[0,1,2,3,4,5].map(i=>{const x=50+(i%3)*60,y=60+Math.floor(i/3)*70;return `<circle cx="${x}" cy="${y}" r="13" fill="var(--wk)" opacity=".85"/><path d="M${x-20} ${y+38} q20 -30 40 0" fill="var(--wk)" opacity=".85"/>`}).join('')}
  <text x="110" y="210" text-anchor="middle" font-family="Schibsted Grotesk,Arial" font-size="13" fill="var(--muted)">people with the need</text>
  <path d="M215 95 H305" stroke="var(--ink)" stroke-width="2" marker-end="url(#ar)"/><text x="260" y="85" text-anchor="middle" font-family="Schibsted Grotesk,Arial" font-size="12" fill="var(--muted)">money</text>
  <path d="M305 145 H215" stroke="var(--ink)" stroke-width="2" marker-end="url(#ar)"/><text x="260" y="168" text-anchor="middle" font-family="Schibsted Grotesk,Arial" font-size="12" fill="var(--muted)">product</text>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--ink)"/></marker></defs>
  <text x="410" y="22" text-anchor="middle" font-family="Schibsted Grotesk,Arial" font-weight="700" font-size="15" fill="var(--ink)">INDUSTRY · the sellers</text>
  ${[0,1,2].map(i=>`<rect x="335" y="${42+i*52}" width="150" height="38" rx="8" fill="none" stroke="var(--ink)" stroke-width="1.5"/><text x="410" y="${66+i*52}" text-anchor="middle" font-family="Schibsted Grotesk,Arial" font-size="13" fill="var(--ink)">Firm ${'ABC'[i]}</text>`).join('')}
  <text x="410" y="210" text-anchor="middle" font-family="Schibsted Grotesk,Arial" font-size="13" fill="var(--muted)">firms selling similar products</text>
</svg>`;

function sizeCalc(el){
  const key='ent141-w12-size'; let st; try{st=JSON.parse(store.get(key)||'null')}catch(e){}
  if(!st) st={n:100000,p:240,sam:40,som:2};
  const f=v=>Math.round(v).toLocaleString('en-US');
  el.innerHTML=`<div class="calc">
    <div class="g2"><div><label for="c-n">Step 1 · Customers with the need (TAM count)</label><input id="c-n" type="number" min="0" data-k="n" value="${st.n}"></div>
    <div><label for="c-p">Step 2 · What one customer pays per year (AED)</label><input id="c-p" type="number" min="0" data-k="p" value="${st.p}"></div>
    <div><label for="c-s">Step 3 · % you can reach (SAM)</label><input id="c-s" type="number" min="0" max="100" data-k="sam" value="${st.sam}"></div>
    <div><label for="c-o">Step 4 · % of SAM you can win in year 1 (SOM)</label><input id="c-o" type="number" min="0" max="100" data-k="som" value="${st.som}"></div></div>
    <div id="c-svg"></div><div class="feedback" id="c-out"></div></div>`;
  const draw=()=>{ const tam=st.n*st.p, samN=st.n*st.sam/100, sam=samN*st.p, somN=samN*st.som/100, som=somN*st.p;
    const r=v=>tam>0?Math.max(16,110*Math.sqrt(v/tam)):16;
    const R=[110,r(sam),r(som)];
    el.querySelector('#c-svg').innerHTML=`<svg viewBox="0 0 420 240" role="img" aria-label="Nested circles: TAM, SAM, SOM">
      ${R.map((x,i)=>`<circle cx="130" cy="${230-x}" r="${x}" fill="var(--wk)" fill-opacity="${.15+i*.28}" stroke="var(--wk)"/>`).join('')}
      ${[['TAM',tam,30],['SAM',sam,105],['SOM',som,180]].map(([k,v,y])=>`<text x="262" y="${y}" font-family="Schibsted Grotesk,Arial" font-weight="800" font-size="16" fill="var(--wk)">${k}</text><text x="262" y="${y+20}" font-family="Schibsted Grotesk,Arial" font-size="14" fill="var(--ink)">AED ${f(v)}</text>`).join('')}
    </svg>`;
    el.querySelector('#c-out').innerHTML=`TAM = ${f(st.n)} × ${f(st.p)} = <b>AED ${f(tam)}</b><br>SAM = ${f(samN)} customers × ${f(st.p)} = <b>AED ${f(sam)}</b><br>SOM = ${f(somN)} customers × ${f(st.p)} = <b>AED ${f(som)}</b>`;
    store.set(key,JSON.stringify(st)); };
  el.querySelectorAll('[data-k]').forEach(i=>i.addEventListener('input',()=>{ st[i.dataset.k]=Math.max(0,+i.value||0); draw(); }));
  draw();
}

const DATA={'UAE':[
  ['Bayanat','The official UAE open data portal (bayanat.ae): population, education, health and economy data from federal and local bodies.'],
  ['Dubai Pulse','Dubai’s open data platform (dubaipulse.gov.ae): transport, tourism, population and city services.'],
  ['Federal Competitiveness and Statistics Centre','The UAE federal statistics body: national population and economic figures.'],
  ['Dubai Statistics Center','Official statistics for the Emirate of Dubai: population, labour, prices.']],
 'World':[
  ['World Bank Open Data','data.worldbank.org: population, income, education and business indicators by country and year.'],
  ['UN SDG Global Database','Official data for every SDG indicator, by country. Useful for your sustainability section too.']]};

const NEED_PAY=`<svg viewBox="0 0 520 240" role="img" aria-label="Two overlapping circles: people with a need, and people able to pay. The overlap is the market" style="width:100%;height:auto">
  <circle cx="200" cy="120" r="105" fill="var(--wk)" fill-opacity=".12" stroke="var(--wk)" stroke-width="2"/>
  <circle cx="320" cy="120" r="105" fill="var(--wk)" fill-opacity=".12" stroke="var(--wk)" stroke-width="2"/>
  <text x="150" y="115" text-anchor="middle" font-family="Schibsted Grotesk,Arial" font-weight="800" font-size="16" fill="var(--ink)">Has a need</text>
  <text x="150" y="137" text-anchor="middle" font-family="Schibsted Grotesk,Arial" font-size="12.5" fill="var(--muted)">a real pain</text>
  <text x="370" y="115" text-anchor="middle" font-family="Schibsted Grotesk,Arial" font-weight="800" font-size="16" fill="var(--ink)">Can pay</text>
  <text x="370" y="137" text-anchor="middle" font-family="Schibsted Grotesk,Arial" font-size="12.5" fill="var(--muted)">money or budget</text>
  <rect x="222" y="104" width="76" height="32" rx="16" fill="var(--wk)"/>
  <text x="260" y="125" text-anchor="middle" font-family="Schibsted Grotesk,Arial" font-weight="800" font-size="14" fill="var(--on-wk)">Market</text>
</svg>`;

const PESTLE=[
  {t:'Political',s:'government',d:'What does the government plan or support? Policies, strategies, programmes.'},
  {t:'Economic',s:'money',d:'Taxes, prices, costs, income. Can customers pay? Can the business earn?'},
  {t:'Social',s:'people',d:'Habits, culture, age, lifestyle. Will people change how they act?'},
  {t:'Technological',s:'tools',d:'Which tools, apps or materials exist? Can your team use them?'},
  {t:'Legal',s:'laws',d:'Which laws, licences and rules apply to your idea?'},
  {t:'Environmental',s:'planet',d:'Waste, energy, water, climate. Does your idea help or harm?'}];

const PEX={
  'P · Political':[['UAE Net Zero 2050','In October 2021, the UAE announced its Net Zero by 2050 strategic initiative. Green ideas fit national goals. <span class="tag good">opportunity</span>']],
  'E · Economic':[['Corporate tax 9%','Since June 2023, UAE businesses pay 9% tax on profit above AED 375,000. Plan it in your costs. <span class="tag">cost</span>'],['VAT 5%','Since 1 January 2018, most sales in the UAE carry 5% VAT. Add it to your price. <span class="tag">cost</span>']],
  'S · Social':[['Shopping habits','Shoppers must now remember a bag. Find this pain in your own interviews. <span class="tag">your evidence</span>']],
  'T · Technological':[['Tracking bags','Could a QR code track each bag? Check what your team can really build. <span class="tag">your evidence</span>']],
  'L · Legal':[['Plastic bag ban','Dubai Executive Council Resolution No. 124 of 2023. Single-use plastic bags are banned from 1 January 2024. <span class="tag good">opportunity</span>']],
  'E · Environmental':[['Less plastic waste','The same ban aims to cut plastic waste. Reusable bags support this aim. <span class="tag good">opportunity</span>']]};

const FIX=[
  {q:'“Our market is everyone in the UAE.”',type:'too broad',hint:'Name the customer with the need and the money. Then count them.'},
  {q:'PESTLE lists facts with no source.',type:'no evidence',hint:'Write the law, the body and the year next to each fact.'},
  {q:'Only good news in the PESTLE table.',type:'blind spot',hint:'Add at least one threat. A cost or a law can stop you.'},
  {q:'“Market” and “industry” used as the same word.',type:'mixed terms',hint:'Market = buyers. Industry = sellers.'}];

function reflect(qs,exit){ return `<div class="stack ui">${qs.map((q,i)=>`<div class="feedback"><b>Q${i+1}</b> ${q}</div>`).join('')}<div class="box exam"><b class="lbl">Exit question</b>${exit}</div></div>`; }

Lecture.mount({
  id:'ent141-w12', week:12, clo:'3', course:'ENT 141', short:'Week 12 · Market/Industry Analysis', instructor:'Nadia',
  title:'Market/Industry Analysis', meta:'Byers et al. (2019) Ch. 2, 3 · 2-hour lecture',
  scenes:[
  { nav:'Start here', title:'Is there a market for your idea?', minutes:5,
    narration:[`Today you ask two questions. Who will buy? What is happening around us? <span class="mono">Topics: What is a market? · PESTLE analysis. CLO 3.</span>`],
    think:`A friend wants to open a karak tea stand at the campus gate. What would you check before spending any money?`,
    src:`Reading: Byers, T. H., Dorf, R. C., &amp; Nelson, A. J. (2019). <em>Technology ventures: From idea to enterprise</em> (5th ed.), Ch. 2, 3. McGraw-Hill.`,
    fig:{label:`Today's lecture · 120 minutes`, build:el=>W.agenda(el,[[`Start here`,5,'l'],[`What is a market?`,10,'l'],[`Market vs industry`,10,'l'],[`PESTLE`,15,'l'],[`PESTLE in the UAE`,15,'l'],[`Find real data`,10,'l'],[`How big is the market?`,10,'l'],[`Mistake → fix`,5,'l'],[`Project 2 · section 3`,30,'a'],[`Think about it`,10,'a']])} },

  { nav:'What is a market?', title:'What is a market?', minutes:10,
    narration:[`A <b>market</b> is people with a need who can pay. A need alone is not a market. Money alone is not a market. You need both.`],
    src:`Byers et al. (2019), Ch. 2, 3.`,
    fig:{label:`Concept · need + ability to pay`, html:NEED_PAY} },

  { nav:'Market vs industry', title:'Market vs industry', minutes:10,
    narration:[`The <b>market</b> is the buyers. The <b>industry</b> is the firms selling similar products. Uber agreed to buy Careem in March 2019. The industry changed. Riders’ need did not.`],
    src:`Byers et al. (2019). · Uber Technologies (2019, March 26). Uber to acquire Careem [Press release].`,
    fig:{label:`Two sides of the same exchange`, html:MKT_IND} },

  { nav:'PESTLE', title:'PESTLE analysis', minutes:15,
    narration:[`<b>PESTLE</b> scans the world around your idea. Six letters, six questions. Each one shows an opportunity or a threat. Press play.`],
    src:`Byers et al. (2019), Ch. 2, 3: the business environment.`,
    fig:{label:`Concept · six steps`, flow:PESTLE} },

  { nav:'PESTLE in the UAE', title:'PESTLE step by step: a UAE example', minutes:15,
    narration:[`Fictional idea: a reusable bag rental at Dubai supermarkets. The facts are real. Click each letter.`],
    src:`Dubai Executive Council Resolution No. (124) of 2023 Regulating the Use of Single-use Products. · Federal Decree-Law No. 47 of 2022 on the Taxation of Corporations and Businesses. · Federal Decree-Law No. 8 of 2017 on Value Added Tax. · UAE Government (2021). UAE Net Zero 2050 strategic initiative.`,
    fig:{label:`Real facts · click a letter`, build:el=>W.picker(el,PEX,'Select a letter.')} },

  { nav:'Find real data', title:'Where to find real numbers', minutes:10,
    narration:[`Use <b>official open data</b>. Write the source and year next to each number. More sources in the <a href="toolkit.html#s4">open data finder</a>.`],
    fig:{label:`Trusted open data · click to read`, build:el=>W.picker(el,DATA,'Select a source.')} },

  { nav:'How big is the market?', title:'Optional · How big is the market?', minutes:10,
    narration:[`<b>TAM</b>: everyone with the need. <b>SAM</b>: the part you can reach. <b>SOM</b>: the part you can win in year 1. Change the numbers.`],
    fig:{label:`Market size calculator · illustrative numbers`, build:sizeCalc, caption:`Illustrative numbers only, not real data. Your team must use real figures with a source.`} },

  { nav:'Mistake → fix', title:'Mistake → fix', kind:'review', minutes:5,
    narration:[`Four common mistakes. Say the fix out loud before you reveal it.`],
    fig:{label:`Common mistakes · reveal the fix`, build:el=>W.practice(el,FIX,{label:'Fix',prefix:''})} },

  { nav:'Project 2 · section 3', title:'Team activity · PESTLE for your idea', kind:'activity', minutes:30, wide:true,
    narration:[`Use your chosen idea from section 2. Fill one line per letter. Add a source for each fact.`,
      `<a class="btn" href="project-2.html">Paste into Project 2, section 3 →</a>`],
    fig:{label:`Market and PESTLE · saves in your browser`, build:el=>W.worksheet(el,{id:'ent141-w12-market',title:'ENT 141 · Project 2 · Section 3 · Market and PESTLE analysis',fields:[
      {l:'Our market: who has the need and can pay',rows:2},
      {l:'P and E: one fact each, with source',rows:3},
      {l:'S and T: one finding each (interviews or source)',rows:3},
      {l:'L and E: one fact each, with source',rows:3},
      {l:'Biggest opportunity and biggest threat',rows:2}]})} },

  { nav:'Think about it', title:'Think about it', kind:'review', minutes:10,
    narration:[`Discuss with your team. There is no single right answer.`,`<b>Next week:</b> Value Proposition Canvas, part 1. Bring your interview notes and empathy map.<br><a class="btn" href="week-13.html">Next lecture · Week 13 · Value Proposition Canvas (Part 1) →</a>`],
    fig:{label:`Reflection`, html:reflect([`A new law appears next year. Which PESTLE letter could hurt your idea most?`,`Your users have the need but little money. Is that still a market?`,`Which PESTLE fact surprised your team?`],`In one sentence: who is your market?`)} },
  ]
});
</script>
</body>
</html>
