<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Week 10 · Entrepreneurial Strategy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Schibsted+Grotesk:wght@400;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<link rel="stylesheet" href="assets/course.css">
<style>
:root{--wk:#9D174D;--wk-soft:rgba(157,23,77,.09);--wk-d:#F9A8D4;--wk-soft-d:rgba(249,168,212,.14)}
/* grades map */
.gm{font-family:var(--f-display)}
.gm-bar{display:flex;gap:3px;height:46px;margin:4px 0 6px}
.gm-seg{display:flex;align-items:center;justify-content:center;border-radius:6px;font-weight:800;font-size:.82rem;min-width:0;overflow:hidden;white-space:nowrap}
.gm-seg.done{background:var(--good);color:var(--on-wk)}
.gm-seg.next{background:var(--wk-soft);border:2px dashed var(--wk);color:var(--ink)}
.gm-half{display:flex;font-family:var(--f-mono);font-size:.74rem;color:var(--muted);margin-bottom:14px}
.gm-half span{flex:1}
.gm-half span:last-child{text-align:right}
.gm-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.gm-col{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.gm-col h4{margin:0 0 8px;font-size:.95rem;color:var(--ink)}
.gm-col.d h4{color:var(--good)}
.gm-col.n{border-color:var(--wk)}
.gm-col.n h4{color:var(--wk)}
.gm-col ul{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.gm-col li{font-size:.86rem;line-height:1.3;color:var(--ink)}
.gm-col li b{font-weight:800}
.gm-col li small{display:block;font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
@media (max-width:520px){.gm-cols{grid-template-columns:minmax(0,1fr)}.gm-bar{gap:2px}.gm-seg{font-size:.68rem}}
/* project 2 road */
.road{list-style:none;margin:0;padding:0 0 0 4px;font-family:var(--f-display);position:relative}
.road li{display:grid;grid-template-columns:38px minmax(0,1fr);gap:12px;align-items:center;position:relative;padding:6px 0}
.road li:not(:last-child)::after{content:"";position:absolute;left:18px;top:42px;bottom:-12px;border-left:3px dotted var(--line)}
.road .dot{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.95rem;border:2px solid var(--line);background:var(--surface);color:var(--ink);position:relative;z-index:1}
.road li.now .dot{background:var(--wk);border-color:var(--wk);color:var(--on-wk)}
.road li.end .dot{background:var(--good);border-color:var(--good);color:var(--on-wk)}
.road .t{font-weight:700;font-size:.95rem;color:var(--ink)}
.road .w{display:inline-block;margin-left:6px;font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.road li.now .w{color:var(--wk);font-weight:600}
/* case card */
.cc{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface);font-family:var(--f-display);max-width:100%}
.cc-h{display:flex;gap:14px;align-items:center;padding:12px 14px;background:var(--wk-soft);border-bottom:1px solid var(--line)}
.cc-h .mini{flex:none;width:64px;height:64px}
.cc-h .mini svg{width:100%;height:100%;display:block}
.cc-h .who{min-width:0}
.cc-h .eb{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--wk);font-weight:600}
.cc-h b{display:block;font-size:1.2rem;font-weight:800;color:var(--ink);line-height:1.15}
.cc-h small{display:block;font-family:var(--f-mono);font-size:.74rem;color:var(--muted);margin-top:2px}
.cc dl{margin:0}
.cc-r{display:grid;grid-template-columns:132px minmax(0,1fr);gap:10px;padding:10px 14px;border-bottom:1px dashed var(--line);align-items:baseline}
.cc-r:last-child{border-bottom:0}
.cc-r dt{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.cc-r dd{margin:0;font-size:.95rem;line-height:1.4;color:var(--ink)}
.cc-r.ls{background:var(--wk-soft)}
.cc-r.ls dt{color:var(--wk)}
.cc-r.ls dd{font-weight:700}
@media (max-width:520px){.cc-r{grid-template-columns:minmax(0,1fr);gap:2px}.cc-h .mini{width:52px;height:52px}}
/* in-depth case reading */
.rc{border:1px solid var(--line);border-left:4px solid var(--wk);border-radius:10px;padding:12px 16px;background:var(--surface);font-size:.98rem;line-height:1.55}
.rc .lbl{display:block;font-family:var(--f-mono);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--wk);font-weight:600;margin-bottom:4px}
.rc p{margin:.4em 0}
</style>
</head>
<body>
<script src="assets/site.js"></script>
<script src="assets/supports.js"></script>
<script src="assets/course.js"></script>
<script src="assets/onepage.js"></script>
<script src="assets/ent141.js"></script>
<script src="assets/kb.js"></script>
<script src="assets/search-index.js"></script>
<script src="assets/assistant.js"></script>
<script>
const {W} = Lecture; const {store,esc} = ENT141;
const F='font-family="Schibsted Grotesk,Arial"';

/* ---------- grades map (from Weeks 8–11 page) ---------- */
const GRADES_HTML=`<div class="gm" role="img" aria-label="Course marks: 40% done, 60% left">
  <div class="gm-bar">
    <div class="gm-seg done" style="flex:30" title="Project 1 poster · 30%">30%</div>
    <div class="gm-seg done" style="flex:10" title="Project 1 presentation · 10%">10%</div>
    <div class="gm-seg next" style="flex:10" title="Activity 1 · 10%">10%</div>
    <div class="gm-seg next" style="flex:10" title="Activity 2 · 10%">10%</div>
    <div class="gm-seg next" style="flex:40" title="Project 2 · 40%">40%</div>
  </div>
  <div class="gm-half"><span>0%</span><span style="text-align:center">40% done</span><span>100%</span></div>
  <div class="gm-cols">
    <div class="gm-col d"><h4>Done · 40%</h4><ul>
      <li><b>Project 1</b> · poster · 30%<small>Week 9</small></li>
      <li><b>Project 1</b> · presentation · 10%<small>Week 9</small></li></ul></div>
    <div class="gm-col n"><h4>Next · 60%</h4><ul>
      <li><a href="activity-1.html"><b>Activity 1</b></a> · case analysis · 10%<small>individual · in class Week 11 · due Thu 19 Nov 23:59</small></li>
      <li><a href="activity-2.html"><b>Activity 2</b></a> · video pitch · 10%<small>individual · due Thu 3 Dec 23:59</small></li>
      <li><a href="project-2.html"><b>Project 2</b></a> · Idea Validation Report · 40%<small>team · due Thu 17 Dec 23:59</small></li></ul></div>
  </div></div>`;

/* ---------- Project 2 road (from Weeks 8–11 page) ---------- */
const ROAD_HTML=`<ol class="road" aria-label="Project 2 sections and when each is built">
  <li class="now"><span class="dot">1</span><span class="t">Three ideas<span class="w">starts today · Weeks 10–11</span></span></li>
  <li><span class="dot">2</span><span class="t">Score and choose<span class="w">Week 8 method</span></span></li>
  <li><span class="dot">3</span><span class="t">Market<span class="w">Week 12</span></span></li>
  <li><span class="dot">4</span><span class="t">Value proposition canvas<span class="w">Weeks 13–14</span></span></li>
  <li><span class="dot">5</span><span class="t">Differentiation<span class="w">Weeks 15–16</span></span></li>
  <li><span class="dot">6</span><span class="t">Sustainability check<span class="w">+ evidence and references</span></span></li>
  <li class="end"><span class="dot">✓</span><span class="t">Submit on Moodle<span class="w">Thu 17 Dec 23:59</span></span></li>
</ol>`;

/* ---------- Porter's grid (concept) ---------- */
const SVG_PORTER=`<svg viewBox="0 0 560 330" role="img" aria-label="Porter's three ways to win: cost leadership, differentiation, and focus">
  <text x="335" y="20" text-anchor="middle" ${F} font-weight="700" font-size="14" class="t-muted">How do we win?</text>
  <text x="235" y="46" text-anchor="middle" ${F} font-weight="700" font-size="14">Lower cost</text>
  <text x="435" y="46" text-anchor="middle" ${F} font-weight="700" font-size="14">Different, better</text>
  <text x="20" y="190" text-anchor="middle" ${F} font-weight="700" font-size="14" class="t-muted" transform="rotate(-90 20 190)">Where?</text>
  <text x="80" y="120" text-anchor="middle" ${F} font-weight="700" font-size="14">Broad</text>
  <text x="80" y="138" text-anchor="middle" ${F} font-size="12" class="t-muted">many users</text>
  <text x="80" y="250" text-anchor="middle" ${F} font-weight="700" font-size="14">Narrow</text>
  <text x="80" y="268" text-anchor="middle" ${F} font-size="12" class="t-muted">one group</text>
  <rect x="140" y="60" width="190" height="120" rx="10" fill="var(--wk)"/>
  <text x="235" y="118" text-anchor="middle" ${F} font-weight="800" font-size="17" style="fill:var(--on-wk)">1 · Cost leadership</text>
  <text x="235" y="140" text-anchor="middle" ${F} font-size="13" style="fill:var(--on-wk)">cheapest</text>
  <rect x="340" y="60" width="190" height="120" rx="10" fill="var(--wk-soft)" stroke="var(--wk)" stroke-width="2"/>
  <text x="435" y="118" text-anchor="middle" ${F} font-weight="800" font-size="17">2 · Differentiation</text>
  <text x="435" y="140" text-anchor="middle" ${F} font-size="13" class="t-muted">different and better</text>
  <rect x="140" y="190" width="390" height="120" rx="10" fill="none" stroke="var(--wk)" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="335" y="240" text-anchor="middle" ${F} font-weight="800" font-size="17">3 · Focus</text>
  <text x="335" y="264" text-anchor="middle" ${F} font-size="13" class="t-muted">serve one small group very well</text>
</svg>`;

/* ---------- strategy ladder (concept) ---------- */
const rung=(y,w,fill,txtFill,big,small)=>`<rect x="${280-w/2}" y="${y}" width="${w}" height="54" rx="10" ${fill}/>
  <text x="280" y="${y+24}" text-anchor="middle" ${F} font-weight="800" font-size="17" ${txtFill}>${big}</text>
  <text x="280" y="${y+43}" text-anchor="middle" ${F} font-size="13" ${txtFill==='style="fill:var(--on-wk)"'?txtFill:'class="t-muted"'}>${small}</text>`;
const SVG_LADDER=`<svg viewBox="0 0 560 345" role="img" aria-label="Strategy ladder: vision, mission, goal, objectives, tactics">
  <path d="M40 335 V30" stroke="var(--wk)" stroke-width="3" marker-end="url(#ar)"/>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--wk)"/></marker></defs>
  <text x="58" y="40" ${F} font-size="12" class="t-muted">big, long term</text>
  <text x="58" y="338" ${F} font-size="12" class="t-muted">small, this week</text>
  ${rung(10,260,'fill="var(--wk)"','style="fill:var(--on-wk)"','Vision','where we want to be')}
  ${rung(74,300,'fill="var(--wk-soft)" stroke="var(--wk)" stroke-width="2"','','Mission','what we do, for whom, why')}
  ${rung(138,340,'fill="none" stroke="var(--wk)" stroke-width="2"','','Goal','one broad result we want')}
  ${rung(202,380,'fill="none" stroke="var(--wk)" stroke-width="2" stroke-dasharray="6 5"','','Objectives','SMART: a number and a date')}
  ${rung(266,420,'fill="none" stroke="var(--line)" stroke-width="2"','','Tactics','actions we do this week')}
</svg>`;

/* mini graphics for case cards */
const MINI_EYE=`<svg viewBox="0 0 64 64" aria-hidden="true">
  <path d="M4 32 C16 12 48 12 60 32 C48 52 16 52 4 32 z" fill="var(--wk-soft)" stroke="var(--wk)" stroke-width="2.5"/>
  <circle cx="32" cy="32" r="10" fill="var(--wk)"/></svg>`;
const MINI_ARROW=`<svg viewBox="0 0 64 64" aria-hidden="true">
  <circle cx="32" cy="32" r="28" fill="var(--wk-soft)" stroke="var(--wk)" stroke-width="2"/>
  <circle cx="32" cy="32" r="16" fill="none" stroke="var(--wk)" stroke-width="2"/>
  <circle cx="32" cy="32" r="5" fill="var(--wk)"/></svg>`;

/* ---------- case card ---------- */
function caseCard(c){
  const rows=[...(c.rows||[]),['What they did',c.did],[c.whyLbl||'Why it worked',c.why]];
  return `<article class="cc" aria-label="Case study: ${esc(c.org)}">
  <div class="cc-h"><div class="mini">${c.mini||''}</div><div class="who"><span class="eb">${c.tag}</span><b>${c.org}</b><small>${c.place} · ${c.year}</small></div></div>
  <dl>${rows.map(([k,v])=>`<div class="cc-r"><dt>${k}</dt><dd>${v}</dd></div>`).join('')}
  <div class="cc-r ls"><dt>Lesson</dt><dd>${c.lesson}</dd></div></dl></article>`;
}

const CASE_IKEA=caseCard({tag:'Case · a vision',org:'IKEA',place:'Sweden',year:'founded 1943',mini:MINI_EYE,
  rows:[['Vision','“To create a better everyday life for the many people.”']],
  did:'It sells well-designed furniture at low prices. Flat packs keep costs down.',
  whyLbl:'Why it helps',why:'Short and easy to remember. Every team can check its work against it.',
  lesson:'A vision is a picture of the future. It is not a product.'});

const CASE_PAT=caseCard({tag:'Case · a mission',org:'Patagonia',place:'USA',year:'statement adopted 2018',mini:MINI_ARROW,
  rows:[['Purpose','“We’re in business to save our home planet.”']],
  did:'It repairs worn clothes through Worn Wear. In 2022, its founder gave the company to fight climate change.',
  whyLbl:'Why it helps',why:'The words guide big choices. Customers see actions, not only words.',
  lesson:'A mission says what you do and why. Actions must match it.'});

const CASE_CAREEM=caseCard({tag:'Case · a purpose',org:'Careem',place:'UAE (Dubai)',year:'founded 2012',mini:MINI_ARROW,
  rows:[['Purpose','“To simplify and improve the lives of people, and build an awesome organisation that inspires.”']],
  did:'It started with rides. Later its app added more services, such as food delivery.',
  whyLbl:'Why it helps',why:'The purpose is wide. It allowed growth beyond rides.',
  lesson:'A clear purpose can guide a venture as it grows.'});

/* ---------- team example (fictional, step by step) ---------- */
const STEPS=[
  {t:'Vision',s:'1',d:'“Every student on campus drinks clean water without plastic bottles.”'},
  {t:'Mission',s:'2',d:'We install refill stations (what) for CUD students (for whom) to cut plastic waste (why).'},
  {t:'Goal',s:'3',d:'Reduce plastic bottles bought on campus.'},
  {t:'Objectives',s:'4',d:'Install 3 stations by 15 Dec. Get 200 refills a week by end of January.'},
  {t:'Tactics',s:'5',d:'Ask Facilities for 3 spots. Design a poster. Count refills each Friday.'}];

const SMART=[
  {t:'Specific',s:'S',d:'Say exactly what will change.'},
  {t:'Measurable',s:'M',d:'Use a number you can count.'},
  {t:'Achievable',s:'A',d:'Your team can really do it.'},
  {t:'Relevant',s:'R',d:'It moves the goal forward.'},
  {t:'Time-bound',s:'T',d:'It has a date.'}];

const FIX=[
  {q:'“Our vision is to sell the best app.”',hint:'That is a product, not a vision. Describe the better world your users will live in.'},
  {q:'“Objective: help many students.”',hint:'Not SMART. Add a number and a date. Example: 50 students by 30 January.'},
  {q:'“Tactic: be successful.”',hint:'A tactic is an action. Write a verb: call, build, post, count.'}];

Lecture.mount({
  id:'ent141-w10', week:10, clo:'1, 3', course:'ENT 141', short:'Week 10 · Entrepreneurial Strategy', instructor:'Nadia',
  title:'Entrepreneurial Strategy', meta:'Byers et al. (2019), Ch. 3 · 2-hour lecture',
  scenes:[
  { nav:'Start here', title:'Where is your team going?', minutes:5,
    narration:[`Project 1 is done. Today we start Project 2. We learn vision, mission, goals, objectives and tactics. <span class="mono">CLO 1 · CLO 3.</span>`],
    think:`You plan a trip from Dubai to Abu Dhabi. First you choose the place. Then the road. Then you start the car. Which comes first in a venture?`,
    src:`Reading: Byers, T. H., Dorf, R. C., &amp; Nelson, A. J. (2019). <em>Technology ventures: From idea to enterprise</em> (5th ed.), Ch. 3. McGraw-Hill.`,
    fig:{label:`Today's lecture · 120 minutes`, build:el=>W.agenda(el,[[`Start here`,5,'l'],[`Your grades map`,5,'c'],[`Project 2 map`,5,'c'],[`Vision`,8,'l'],[`Mission`,8,'l'],[`The strategy ladder`,8,'l'],[`SMART objectives`,8,'l'],[`Team example`,8,'l'],[`How will we win?`,5,'l'],[`Case: Careem`,15,'a'],[`Mistake → fix`,5,'c'],[`Team: our strategy`,30,'a'],[`Think about it`,10,'c']])} },

  { nav:'Your grades map', title:'Your grades map', kind:'review', minutes:5,
    narration:[`40% of your marks are done. The rest: Activity 1 and Activity 2 (alone), and Project 2 (team).`],
    src:`ENT 141 syllabus, Fall 2026: assessment plan.`,
    fig:{label:`Course marks · 100%`, html:GRADES_HTML} },

  { nav:'Project 2 map', title:'Project 2 map', kind:'review', minutes:5,
    narration:[`Project 2 is one team report. We build one section in each lecture. Today you start section 1 with your team strategy.`,
      `<a class="btn" href="project-2.html">Open the Project 2 builder →</a>`],
    src:`ENT 141 Project 2 · Idea Validation Report (40%, team), due Thu 17 Dec, 23:59, on Moodle.`,
    fig:{label:`The road to 17 December`, html:ROAD_HTML} },

  { nav:'Vision', title:'Vision: where we want to be', minutes:8,
    narration:[`A <b>vision</b> describes the future you want to create. It is big and long term. It inspires the team.`],
    src:`Byers et al. (2019), Ch. 3. · IKEA. (n.d.). <em>This is IKEA</em>: vision. ikea.com.`,
    fig:{label:`Case study · a real vision`, html:CASE_IKEA} },

  { nav:'Mission', title:'Mission: what we do, for whom, why', minutes:8,
    narration:[`A <b>mission</b> answers three questions. What do we do? For whom? Why does it matter?`],
    src:`Byers et al. (2019), Ch. 3. · Patagonia. (n.d.). <em>Our purpose</em>; Chouinard, Y. (2022, September 14). <em>Earth is now our only shareholder</em>. patagonia.com.`,
    fig:{label:`Case study · a real mission`, html:CASE_PAT} },

  { nav:'The strategy ladder', title:'The strategy ladder', minutes:8,
    narration:[`Vision and mission sit at the top. Under them: <b>goals</b>, then <b>objectives</b>, then <b>tactics</b>. Each step is smaller and more concrete.`],
    src:`Byers et al. (2019), Ch. 3: vision, mission, goals and objectives.`,
    fig:{label:`Concept · from vision to action`, html:SVG_LADDER} },

  { nav:'SMART objectives', title:'Objectives must be SMART', minutes:8,
    narration:[`A goal is broad. An <b>objective</b> makes it measurable. Check each objective with SMART. Click each letter.`],
    src:`Doran, G. T. (1981). There's a S.M.A.R.T. way to write management's goals and objectives. <em>Management Review</em>, 70(11), 35–36.`,
    fig:{label:`Concept · SMART check · click or play`, flow:SMART} },

  { nav:'Team example', title:'Team example, step by step', minutes:8,
    narration:[`A student team wants less plastic on campus. Follow their ladder from vision to tactics. This team is fictional.`],
    src:`Fictional example for practice.`,
    fig:{label:`Worked example · click or play`, flow:STEPS} },

  { nav:'How will we win?', title:'How will we win?', minutes:5,
    narration:[`Tactics also show how you win. Porter gives three ways: be the cheapest, be different, or focus on one group.`],
    src:`Porter, M. E. (1985). <em>Competitive advantage</em>. Free Press.`,
    fig:{label:`Concept · Porter's grid`, html:SVG_PORTER} },

  { nav:'Case: Careem', title:'Case study · Careem’s purpose', kind:'activity', minutes:15, wide:true,
    narration:[`Read Careem’s purpose. Answer the three questions alone. Then compare with a partner.`, CASE_CAREEM],
    src:`Careem. (n.d.). <em>Our purpose</em>. why.careem.com. · Uber Technologies. (2019, March 26). <em>Uber to acquire Careem</em> [Press release].`,
    fig:{label:`Three questions · saves in your browser`, build:el=>W.worksheet(el,{id:'ent141-w10-careem',title:'ENT 141 · Week 10 · Case study: Careem’s purpose',fields:[
      {l:'Q1 · What does Careem do, for whom, and why?',rows:2},
      {l:'Q2 · Is this closer to a vision or a mission? Why?',rows:2},
      {l:'Q3 · Write one SMART objective Careem could set',rows:2}]})} },

  { nav:'Mistake → fix', title:'Mistake → fix', kind:'review', minutes:5,
    narration:[`Teams often write these three lines. Say the fix first, then reveal it.`],
    src:`Byers et al. (2019), Ch. 3. · Doran (1981).`,
    fig:{label:`Common mistakes · reveal the fix`, build:el=>W.practice(el,FIX,{label:'Fix',prefix:'<b>Fix:</b> '})} },

  { nav:'Team: our strategy', title:'Team · Our strategy ladder', kind:'activity', minutes:30, wide:true,
    narration:[`Start from your Project 1 problem. Build your ladder, top to bottom. This starts section 1 of Project 2.`,
      `<a class="btn" href="project-2.html#p-s1">Open Project 2, sections 1 and 2 →</a>`],
    fig:{label:`Team worksheet · saves in your browser`, build:el=>W.worksheet(el,{id:'ent141-w10-directions',title:'ENT 141 · Week 10 · Our strategy ladder',fields:[
      {l:'Our vision: where we want to be',rows:2},
      {l:'Our mission: what we do, for whom, why',rows:2},
      {l:'One goal',rows:1},
      {l:'SMART objective 1 (number + date)',rows:2},
      {l:'SMART objective 2 (number + date)',rows:2},
      {l:'Three tactics: actions we start this week',rows:3}]})} },

  { nav:'Think about it', title:'Think about it', kind:'review', minutes:10,
    narration:[`Discuss with your team. There is no single right answer.`,
      `<b>Exit question:</b> read your mission aloud. Would a user understand it in ten seconds?`,
      `<b>Next week:</b> Overview of Entrepreneurial Strategies. How to share and review a strategy. Activity 1 in class.`,
      `<a class="btn" href="week-11.html">Next lecture · Week 11 · Overview of Entrepreneurial Strategies →</a>`],
    fig:{label:`Reflection · strategy`, build:el=>W.practice(el,[
      {q:'Should a vision change every year?',hint:'Usually not. Objectives and tactics change. The vision stays as the direction.'},
      {q:'Does your mission match what your interviewees told you?',hint:'Go back to your Project 1 quotes. Users decide, not your own taste.'},
      {q:'Which tactic can your team start before next week?',hint:'Pick the smallest one. Then check if it helped.'}],{label:'One view',prefix:''})} },
  ]
});
</script>
</body>
</html>
